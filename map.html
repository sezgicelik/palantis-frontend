#map-klasik-wrap table.kmap td.kt-col { background:linear-gradient(145deg,#6a5018,#7e6020,#584010); }
#map-klasik-wrap table.kmap td.kt-bos { background:linear-gradient(145deg,#243e10,#2e5014,#1c320c); }
#map-klasik-wrap .kmark { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; gap:0; }
#map-klasik-wrap .kmark svg { filter:drop-shadow(0 2px 4px rgba(0,0,0,0.9)); }
#map-klasik-wrap .kname { font:600 7px 'Cinzel',serif; text-shadow:0 0 5px #000,1px 1px 0 #000,-1px -1px 0 #000; white-space:nowrap; max-width:56px; overflow:hidden; text-overflow:ellipsis; letter-spacing:.2px; line-height:1; margin-top:1px; }
#map-klasik-wrap td.kc.kown { box-shadow:inset 0 0 10px rgba(80,160,255,0.25); }
#map-klasik-wrap td.kc.kenemy { box-shadow:inset 0 0 10px rgba(220,60,60,0.2); }

<script>
let MAP_SAYFA = 1;
let MAP_BENIM_SAYFA = 1;
let MAP_BENIM_X = null;
let MAP_BENIM_Y = null;
let MAP_DATA = null;
let MAP_VIEW = '2d';

const KAYNAK_IKON = { odun:'🌳', metal:'⛏️', altin:'💰', bugday:'🌾', balik:'🎣' };
const TARAF_RENK = { iyi:'#3498db', kotu:'#e74c3c' };

const BOLGELER_CLIENT = [
  { id:'kuzey_bati', xMin:1,xMax:66, yMin:1,yMax:16 },
  { id:'kuzey_orta', xMin:1,xMax:66, yMin:17,yMax:33 },
  { id:'kuzey_dogu', xMin:1,xMax:66, yMin:34,yMax:50 },
  { id:'orta_bati', xMin:67,xMax:133, yMin:1,yMax:16 },
  { id:'merkez', xMin:67,xMax:133, yMin:17,yMax:33 },
  { id:'orta_dogu', xMin:67,xMax:133, yMin:34,yMax:50 },
  { id:'guney_bati', xMin:134,xMax:200, yMin:1,yMax:16 },
  { id:'guney_orta', xMin:134,xMax:200, yMin:17,yMax:33 },
  { id:'guney_dogu', xMin:134,xMax:200, yMin:34,yMax:50 },
];
const BOLGE_TILE_BG = {
  kuzey_bati:'#143814', kuzey_orta:'#1a2838', kuzey_dogu:'#222830',
  orta_bati:'#2a2a10', merkez:'#1a1810', orta_dogu:'#2a2210',
  guney_bati:'#102838', guney_orta:'#2a2010', guney_dogu:'#103020'
};

function getBolge(x, y) {
  return BOLGELER_CLIENT.find(b => x >= b.xMin && x <= b.xMax && y >= b.yMin && y <= b.yMax);
}

function setView(v) {
  MAP_VIEW = v;
  document.getElementById('vbtn-2d').classList.toggle('active', v === '2d');
  document.getElementById('vbtn-grid').classList.toggle('active', v === 'grid');
  document.getElementById('vbtn-klasik').classList.toggle('active', v === 'klasik');
  document.getElementById('map-2d-wrap').style.display = v === '2d' ? 'block' : 'none';
  document.getElementById('map-grid-wrap').style.display = v === 'grid' ? 'block' : 'none';
  document.getElementById('map-klasik-wrap').style.display = v === 'klasik' ? 'block' : 'none';
  if (MAP_DATA) {
    if (v === '2d') render2D();
    else if (v === 'grid') renderGrid();
    else renderKlasik();
  }
}

async function mapInit() {
  const token = getToken(); if (!token) return;
  try {
    const resp = await fetch(API_BASE + '/api/map/me', { headers: { 'Authorization': 'Bearer ' + token } });
    if (resp.ok) {
      const data = await resp.json();
      MAP_BENIM_X = data.koordinat.x;
      MAP_BENIM_Y = data.koordinat.y;
      MAP_BENIM_SAYFA = Math.ceil(MAP_BENIM_X / 10);
      MAP_SAYFA = MAP_BENIM_SAYFA;
    }
  } catch(e) {}
  mapYukle();
}

async function mapYukle() {
  const label = document.getElementById('map-sayfa-label');
  const range = document.getElementById('map-x-range');
  const xMin = (MAP_SAYFA - 1) * 10 + 1;
  const xMax = MAP_SAYFA * 10;
  if (label) label.textContent = MAP_SAYFA;
  if (range) range.textContent = xMin + '-' + xMax;
  document.getElementById('map-prev').disabled = MAP_SAYFA <= 1;
  document.getElementById('map-next').disabled = MAP_SAYFA >= 20;

  const token = getToken(); if (!token) return;
  try {
    const resp = await fetch(API_BASE + '/api/map/sayfa?sayfa=' + MAP_SAYFA, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!resp.ok) return;
    MAP_DATA = await resp.json();
    if (MAP_VIEW === '2d') render2D();
    else if (MAP_VIEW === 'grid') renderGrid();
    else renderKlasik();
  } catch(e) {}
}

// ═══════════════════════════════════
// 2D CANVAS — TILE TABANLI HARITA
// ═══════════════════════════════════
function render2D() {
  const canvas = document.getElementById('map-canvas');
  if (!canvas || !MAP_DATA) return;
  const ctx = canvas.getContext('2d');
  // Grid haritadaki en-boy oraniyla AYNI — X:48px Y:10px orani
  const cols = 10, rows = 50;
  const TW = 48; // X genisligi (grid ile ayni)
  const TH = 10; // Y yuksekligi (grid ile ayni)
  const padL = 20, padT = 16;
  canvas.width = padL + cols * TW;
  canvas.height = padT + rows * TH;

  const xMin = MAP_DATA.xMin;
  const cellMap = {};
  (MAP_DATA.oyuncular || []).forEach(o => { cellMap[o.x + ':' + o.y] = { tip: 'oyuncu', d: o }; });
  (MAP_DATA.koloniler || []).forEach(k => { cellMap[k.x + ':' + k.y] = { tip: 'koloni', d: k }; });
  // v1.13.7: Guild sehirleri (oyuncuyu override etmez, ayri katman)
  (MAP_DATA.guildSehirler || []).forEach(g => {
    const key = g.x + ':' + g.y;
    if (!cellMap[key]) cellMap[key] = { tip: 'guild', d: g };
  });
  // v1.13.7: Kadim sehirler (en onemli, oyuncu/koloni override)
  (MAP_DATA.kadimSehirler || []).forEach(k => {
    cellMap[k.x + ':' + k.y] = { tip: 'kadim', d: k };
  });
  // v1.9.3: Konuşlanan ordular map
  const konusMap = {};
  (MAP_DATA.konuslananlar || []).forEach(t => { konusMap[t.x + ':' + t.y] = t; });

  // Arka plan
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // X header
  ctx.fillStyle = '#888';
  ctx.font = 'bold 9px Crimson Pro, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let c = 0; c < cols; c++) {
    ctx.fillText(xMin + c, padL + (c + 0.5) * TW, padT * 0.5);
  }

  // Tile çizimi
  for (let r = 0; r < rows; r++) {
    // Y label
    if ((r + 1) % 5 === 0 || r === 0) {
      ctx.fillStyle = '#555';
      ctx.font = '8px sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(r + 1, padL - 2, padT + (r + 0.5) * TH);
    }

    for (let c = 0; c < cols; c++) {
      const x = xMin + c;
      const y = r + 1;
      const px = padL + c * TW;
      const py = padT + r * TH;
      const bolge = getBolge(x, y);
      const bolgeId = bolge ? bolge.id : 'merkez';

      // Tile çiz (TW x TH boyutunda)
      const tile = getTile(x, y, bolgeId);
      ctx.drawImage(tile, px, py, TW, TH);

      // Oyuncu / Koloni / Guild / Kadim overlay
      const cell = cellMap[x + ':' + y];
      if (cell) {
        if (cell.tip === 'oyuncu') {
          const o = cell.d;
          const renk = o.benMi ? '#2ecc71' : (o.taraf === 'iyi' ? '#3498db' : '#e74c3c');
          ctx.fillStyle = renk;
          ctx.fillRect(px + 1, py + 1, TW - 2, TH - 2);
          ctx.fillStyle = '#fff';
          ctx.font = `${Math.min(TH - 2, 8)}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText(o.kral?.substring(0, 3) || '?', px + TW / 2, py + TH / 2 + 2);
        } else if (cell.tip === 'koloni') {
          const k = cell.d;
          ctx.fillStyle = k.sahip_kral ? 'rgba(231,76,60,0.6)' : 'rgba(46,204,113,0.4)';
          ctx.fillRect(px + 1, py + 1, TW - 2, TH - 2);
          ctx.fillStyle = '#fff';
          ctx.font = `${Math.min(TH - 2, 7)}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText('K', px + TW / 2, py + TH / 2 + 2);
        } else if (cell.tip === 'guild') {
          // v1.13.7: Guild sehir (mor)
          const g = cell.d;
          ctx.fillStyle = '#9b59b6';
          ctx.fillRect(px + 1, py + 1, TW - 2, TH - 2);
          ctx.fillStyle = '#fff';
          ctx.font = `bold ${Math.min(TH - 2, 7)}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText('[' + (g.tag || '?').substring(0, 3) + ']', px + TW / 2, py + TH / 2 + 2);
        } else if (cell.tip === 'kadim') {
          // v1.13.7: Kadim sehir (altin sari, onemli)
          const k = cell.d;
          ctx.fillStyle = k.taraf === 'aydinlik' ? '#f39c12' : '#8e44ad';
          ctx.fillRect(px + 1, py + 1, TW - 2, TH - 2);
          ctx.strokeStyle = '#d4af37';
          ctx.lineWidth = 1;
          ctx.strokeRect(px + 1, py + 1, TW - 2, TH - 2);
          ctx.fillStyle = '#fff';
          ctx.font = `bold ${Math.min(TH - 2, 7)}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText('★' + (k.isim || '?').substring(0, 3), px + TW / 2, py + TH / 2 + 2);
        }
      }

      // v1.9.3: Konuşlanan ordu ikonu (küçük kalkan)
      const konus = konusMap[x + ':' + y];
      if (konus) {
        ctx.fillStyle = 'rgba(155,89,182,0.8)';
        ctx.beginPath();
        ctx.arc(px + TW - 5, py + 2, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '5px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⛨', px + TW - 5, py + 4);
      }
    }
  }

  // Bölge sınır çizgileri
  ctx.strokeStyle = 'rgba(200,169,110,0.2)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  [16, 33].forEach(yBound => {
    const ly = padT + yBound * TH;
    ctx.beginPath(); ctx.moveTo(padL, ly); ctx.lineTo(canvas.width, ly); ctx.stroke();
  });
  ctx.setLineDash([]);

  // Kendi konumuna scroll
  if (MAP_DATA.benim && MAP_DATA.benim.x >= MAP_DATA.xMin && MAP_DATA.benim.x <= MAP_DATA.xMax) {
    const wrap = document.getElementById('map-2d-wrap');
    if (wrap) {
      const targetY = padT + (MAP_DATA.benim.y - 1) * TH - wrap.clientHeight / 2;
      wrap.scrollTop = Math.max(0, targetY);
    }
  }
}

// Canvas tıklama
function canvas2Cell(e) {
  const canvas = document.getElementById('map-canvas');
  if (!canvas || !MAP_DATA) return null;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;
  const c = Math.floor((mx - 20) / 48);
  const r = Math.floor((my - 16) / 10);
  if (c < 0 || c >= 10 || r < 0 || r >= 50) return null;
  return { x: MAP_DATA.xMin + c, y: r + 1 };
}

document.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById('map-canvas');
  if (canvas) {
    canvas.addEventListener('click', (e) => {
      const cell = canvas2Cell(e);
      if (cell) mapSecHucre(cell.x, cell.y);
    });
  }
  setTimeout(mapInit, 1500);
});

// ═══════════════════════════════════
// GRID TABLO
// ═══════════════════════════════════
function renderGrid() {
  if (!MAP_DATA) return;
  const grid = document.getElementById('map-grid');
  if (!grid) return;
  const xMin = MAP_DATA.xMin, xMax = MAP_DATA.xMax;
  const cellMap = {};
  (MAP_DATA.oyuncular || []).forEach(o => { cellMap[o.x + ':' + o.y] = { tip: 'oyuncu', d: o }; });
  (MAP_DATA.koloniler || []).forEach(k => { cellMap[k.x + ':' + k.y] = { tip: 'koloni', d: k }; });
  // v1.13.7: Guild + Kadim sehirler
  (MAP_DATA.guildSehirler || []).forEach(g => {
    const key = g.x + ':' + g.y;
    if (!cellMap[key]) cellMap[key] = { tip: 'guild', d: g };
  });
  (MAP_DATA.kadimSehirler || []).forEach(k => { cellMap[k.x + ':' + k.y] = { tip: 'kadim', d: k }; });
  // v1.9.3: Konuşlanan ordular
  const konusMap2 = {};
  (MAP_DATA.konuslananlar || []).forEach(t => { konusMap2[t.x + ':' + t.y] = t; });

  let html = '<table><thead><tr><th style="width:14px">Y</th>';
  for (let x = xMin; x <= xMax; x++) html += '<th>' + x + '</th>';
  html += '</tr></thead><tbody>';

  for (let y = 1; y <= 50; y++) {
    html += '<tr><th>' + y + '</th>';
    for (let x = xMin; x <= xMax; x++) {
      const cell = cellMap[x + ':' + y];
      const bolge = getBolge(x, y);
      let bg = bolge ? (BOLGE_TILE_BG[bolge.id] || '#0a0a0a') : '#0a0a0a';
      let content = '', color = '#222';
      if (cell) {
        if (cell.tip === 'oyuncu') {
          const o = cell.d;
          if (o.benMi) { bg = '#0a2a0a'; color = '#2ecc71'; content = o.kral.substring(0,3); }
          else { bg = o.taraf==='iyi'?'#0a1420':'#200a0a'; color = TARAF_RENK[o.taraf]; content = o.kral.substring(0,3); }
        } else if (cell.tip === 'koloni') {
          bg = '#1a1500'; color = cell.d.sahip_kral ? '#e67e22' : '#f1c40f';
          content = (KAYNAK_IKON[cell.d.kaynak_tipi]||'⛏');
        } else if (cell.tip === 'guild') {
          bg = '#2a1a35'; color = '#9b59b6';
          content = '[' + (cell.d.tag || '?').substring(0, 3) + ']';
        } else if (cell.tip === 'kadim') {
          bg = '#2a1f00'; color = cell.d.taraf === 'aydinlik' ? '#f39c12' : '#c0392b';
          content = '★';
        }
      }
      // v1.9.3: Konuşlanan ordu ikonu grid'de
      var konusIkon = konusMap2[x + ':' + y] ? '<span style="color:#9b59b6;font-size:11px" title="Ordunuz konuslandi">⛨</span>' : '';
      html += '<td style="background:' + bg + ';color:' + color + '" onclick="mapSecHucre(' + x + ',' + y + ')">' + content + konusIkon + '</td>';
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  grid.innerHTML = html;
}

// ═══════════════════════════════════
// KLASIK (PARSOMEN) GORUNUM — v1.13.8
// ═══════════════════════════════════
function klasikCastleSVG(col, sz) {
  sz = sz || 30;
  return '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 32 30">' +
    '<rect x="1" y="16" width="30" height="13" fill="' + col + '" opacity="0.85"/>' +
    '<rect x="22" y="16" width="9" height="13" fill="rgba(0,0,0,0.22)"/>' +
    '<rect x="1" y="12" width="5" height="5" fill="' + col + '"/>' +
    '<rect x="8" y="12" width="5" height="5" fill="' + col + '"/>' +
    '<rect x="18" y="12" width="5" height="5" fill="' + col + '"/>' +
    '<rect x="26" y="12" width="5" height="5" fill="' + col + '"/>' +
    '<rect x="10" y="5" width="12" height="12" fill="' + col + '"/>' +
    '<rect x="18" y="5" width="4" height="12" fill="rgba(0,0,0,0.18)"/>' +
    '<rect x="10" y="2" width="3" height="4" fill="' + col + '"/>' +
    '<rect x="14.5" y="2" width="3" height="4" fill="' + col + '"/>' +
    '<rect x="19" y="2" width="3" height="4" fill="' + col + '"/>' +
    '<rect x="14" y="8" width="4" height="5" fill="rgba(0,0,0,0.6)"/>' +
    '<rect x="13" y="21" width="6" height="8" fill="rgba(0,0,0,0.65)"/>' +
    '</svg>';
}
function klasikColonySVG(col) {
  return '<svg width="20" height="20" viewBox="0 0 22 22">' +
    '<line x1="11" y1="3" x2="11" y2="18" stroke="rgba(210,180,90,0.7)" stroke-width="1.5"/>' +
    '<path d="M11,3 L19,7 L11,11 Z" fill="' + col + '"/>' +
    '<ellipse cx="11" cy="17" rx="4" ry="1.5" fill="' + col + '" opacity="0.6"/>' +
    '</svg>';
}
const KLASIK_TERRAIN = {
  kuzey_bati: 'kt-orman', kuzey_orta: 'kt-bos', kuzey_dogu: 'kt-dag',
  orta_bati: 'kt-ova', merkez: 'kt-bos', orta_dogu: 'kt-ova',
  guney_bati: 'kt-deniz', guney_orta: 'kt-col', guney_dogu: 'kt-bos'
};
function renderKlasik() {
  if (!MAP_DATA) return;
  const wrap = document.getElementById('map-klasik');
  if (!wrap) return;
  const xMin = MAP_DATA.xMin, xMax = MAP_DATA.xMax;
  const cellMap = {};
  (MAP_DATA.oyuncular || []).forEach(o => { cellMap[o.x + ':' + o.y] = { tip: 'oyuncu', d: o }; });
  (MAP_DATA.koloniler || []).forEach(k => { cellMap[k.x + ':' + k.y] = { tip: 'koloni', d: k }; });
  (MAP_DATA.guildSehirler || []).forEach(g => {
    const key = g.x + ':' + g.y;
    if (!cellMap[key]) cellMap[key] = { tip: 'guild', d: g };
  });
  (MAP_DATA.kadimSehirler || []).forEach(k => { cellMap[k.x + ':' + k.y] = { tip: 'kadim', d: k }; });

  let html = '<table class="kmap"><thead><tr><th class="kcoord" style="width:22px"></th>';
  for (let x = xMin; x <= xMax; x++) html += '<th class="kcoord">' + x + '</th>';
  html += '</tr></thead><tbody>';

  for (let y = 1; y <= 50; y++) {
    html += '<tr><td class="ky">' + y + '</td>';
    for (let x = xMin; x <= xMax; x++) {
      const bolge = getBolge(x, y);
      let tClass = bolge ? (KLASIK_TERRAIN[bolge.id] || 'kt-bos') : 'kt-bos';
      const cell = cellMap[x + ':' + y];
      let extra = '', overlay = '';
      if (cell) {
        if (cell.tip === 'oyuncu') {
          const o = cell.d;
          const col = o.benMi ? '#4a9af0' : (o.taraf === 'iyi' ? '#3498db' : '#d03030');
          extra = o.benMi ? ' kown' : (o.taraf === 'kotu' ? ' kenemy' : '');
          overlay = '<div class="kmark">' + klasikCastleSVG(col, 30) +
            '<div class="kname" style="color:' + col + '">' + (o.kral||'').substring(0,8) + '</div></div>';
        } else if (cell.tip === 'guild') {
          const g = cell.d;
          overlay = '<div class="kmark">' + klasikCastleSVG('#9b59b6', 28) +
            '<div class="kname" style="color:#b580d0">[' + (g.tag||'?').substring(0,4) + ']</div></div>';
        } else if (cell.tip === 'kadim') {
          const k = cell.d;
          const col = k.taraf === 'aydinlik' ? '#f0d050' : '#c0392b';
          overlay = '<div class="kmark">' + klasikCastleSVG(col, 32) +
            '<div class="kname" style="color:' + col + '">★' + (k.isim||'?').substring(0,6) + '</div></div>';
        } else if (cell.tip === 'koloni') {
          const k = cell.d;
          const rcCol = k.kaynak_tipi === 'altin' ? '#c9a020' : (k.kaynak_tipi === 'odun' ? '#4a8a3a' : '#7878b0');
          overlay = '<div class="kmark">' + klasikColonySVG(rcCol) +
            '<div class="kname" style="color:#90d080">' + (k.kaynak_tipi||'').substring(0,5) + '</div></div>';
        }
      }
      html += '<td class="kc ' + tClass + extra + '" onclick="mapSecHucre(' + x + ',' + y + ')" title="' + x + ':' + y + '">' + overlay + '</td>';
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  wrap.innerHTML = html;

  // Kendi konumuna scroll
  if (MAP_DATA.benim && MAP_DATA.benim.x >= xMin && MAP_DATA.benim.x <= xMax) {
    const ko = document.getElementById('map-klasik-wrap');
    if (ko) ko.scrollTop = Math.max(0, (MAP_DATA.benim.y - 5) * 52);
  }
}

// HÜCRE SEÇİMİ
// ═══════════════════════════════════
function mapSecHucre(x, y) {
  const oyuncu = (MAP_DATA?.oyuncular || []).find(o => o.x === x && o.y === y);
  const koloni = (MAP_DATA?.koloniler || []).find(k => k.x === x && k.y === y);
  // v1.13.7: Guild + Kadim
  const guildSehir = (MAP_DATA?.guildSehirler || []).find(g => g.x === x && g.y === y);
  const kadimSehir = (MAP_DATA?.kadimSehirler || []).find(k => k.x === x && k.y === y);
  const konuslanan = (MAP_DATA?.konuslananlar || []).find(t => t.x === x && t.y === y);
  const panel = document.getElementById('map-info');
  const title = document.getElementById('map-info-title');
  const content = document.getElementById('map-info-content');
  if (!panel) return;
  panel.style.display = 'block';

  if (kadimSehir) {
    // v1.13.7: Kadim sehir bilgi paneli (oncelikli)
    const k = kadimSehir;
    title.textContent = '★ ' + k.isim + ' (Kadim Sehir) (' + x + ':' + y + ')';
    content.innerHTML =
      '<div><div style="color:#555;font-size:11px">Isim</div><div style="color:#f39c12;font-weight:bold">' + k.isim + '</div></div>' +
      '<div><div style="color:#555;font-size:11px">Taraf</div><div style="color:' + (k.taraf === 'aydinlik' ? '#f39c12' : '#c0392b') + '">' + (k.taraf === 'aydinlik' ? 'Aydinlik' : 'Karanlik') + '</div></div>' +
      '<div><div style="color:#555;font-size:11px">Durum</div><div>' + (k.state || '-') + '</div></div>' +
      '<div><div style="color:#555;font-size:11px">Ordu Gucu</div><div style="color:#e74c3c">⚔️ ' + (k.ordu_gucu||0).toLocaleString() + '</div></div>' +
      (k.holding_guild_id ? '<div><div style="color:#555;font-size:11px">Holding Guild</div><div>#' + k.holding_guild_id + '</div></div>' : '') +
      '<div><div style="color:#555;font-size:11px">Mesafe</div><div>' + (k.mesafe??'—') + '</div></div>' +
      '<div style="grid-column:1/-1;margin-top:6px;text-align:center"><a href="pazar.html" class="btn-action" style="padding:6px 16px;font-size:12px">🛒 Kadim Pazar</a></div>';
  } else if (guildSehir) {
    // v1.13.7: Guild sehir bilgi paneli
    const g = guildSehir;
    title.textContent = '🏰 [' + g.tag + '] ' + g.isim + ' (' + x + ':' + y + ')';
    content.innerHTML =
      '<div><div style="color:#555;font-size:11px">Guild</div><div style="color:#9b59b6;font-weight:bold">[' + g.tag + '] ' + g.isim + '</div></div>' +
      '<div><div style="color:#555;font-size:11px">Taraf</div><div style="color:' + (TARAF_RENK[g.taraf]||'#888') + '">' + (g.taraf === 'iyi' ? 'Aydinlik' : 'Karanlik') + '</div></div>' +
      '<div><div style="color:#555;font-size:11px">Alan</div><div>' + (g.alan||0).toLocaleString() + '</div></div>' +
      '<div><div style="color:#555;font-size:11px">Mesafe</div><div>' + (g.mesafe??'—') + '</div></div>';
  } else if (oyuncu) {
    title.textContent = '📋 ' + oyuncu.kral + ' (' + x + ':' + y + ')';
    content.innerHTML =
      '<div><div style="color:#555;font-size:11px">Kral</div><div style="color:#d4af37">' + oyuncu.kral + '</div></div>' +
      '<div><div style="color:#555;font-size:11px">Şehir</div><div>' + (oyuncu.sehir||'—') + '</div></div>' +
      '<div><div style="color:#555;font-size:11px">Irk</div><div>' + oyuncu.irk + '</div></div>' +
      '<div><div style="color:#555;font-size:11px">Taraf</div><div style="color:' + (TARAF_RENK[oyuncu.taraf]||'#888') + '">' + (oyuncu.taraf==='iyi'?'Aydınlık':'Karanlık') + '</div></div>' +
      '<div><div style="color:#555;font-size:11px">Çağ</div><div>' + oyuncu.cag + '. Çağ</div></div>' +
      '<div><div style="color:#555;font-size:11px">Alan</div><div>' + (oyuncu.alan||0) + '</div></div>' +
      '<div><div style="color:#555;font-size:11px">Nüfus</div><div>' + (oyuncu.nufus||0) + '</div></div>' +
      '<div><div style="color:#555;font-size:11px">Şehir Değeri</div><div style="color:#d4a257">⚡ ' + (oyuncu.sehir_degeri||0).toLocaleString() + '</div></div>' +
      '<div><div style="color:#555;font-size:11px">Mesafe</div><div>' + (oyuncu.mesafe??'—') + '</div></div>';
  } else if (koloni) {
    title.textContent = '📋 Koloni (' + x + ':' + y + ')';
    const benimMi = koloni.sahip_player_id && OYUNCU && koloni.sahip_player_id === OYUNCU.id;
    const bos = !koloni.sahip_kral;
    content.innerHTML =
      '<div><div style="color:#555;font-size:11px">Tür</div><div style="color:#f1c40f">' + (KAYNAK_IKON[koloni.kaynak_tipi]||'⛏') + ' ' + koloni.kaynak_tipi + '</div></div>' +
      '<div><div style="color:#555;font-size:11px">Bonus</div><div>%' + koloni.bonus_oran + '</div></div>' +
      '<div><div style="color:#555;font-size:11px">Durum</div><div>' + (koloni.sahip_kral ? '🔴 İşgal' : '🟢 Boş') + '</div></div>' +
      (koloni.sahip_kral ? '<div><div style="color:#555;font-size:11px">İşgalci</div><div style="color:' + (TARAF_RENK[koloni.sahip_taraf]||'#888') + '">' + koloni.sahip_kral + '</div></div>' : '') +
      '<div><div style="color:#555;font-size:11px">Mesafe</div><div>' + (koloni.mesafe??'—') + '</div></div>' +
      '<div style="grid-column:1/-1;margin-top:8px;text-align:center">' +
        (bos ? '<select id="koloni-ordu-sec" style="padding:4px;background:#1a1a1a;border:1px solid #333;color:#ddd;border-radius:4px;font-size:10px;margin-right:4px"><option value="">Ordu sec...</option></select><button class="btn-action" onclick="koloniFethet('+koloni.id+',false)" style="padding:6px 16px;font-size:12px;width:auto">⚔️ Fethet</button>' : '') +
        (!bos && !benimMi ? '<select id="koloni-ordu-sec" style="padding:4px;background:#1a1a1a;border:1px solid #333;color:#ddd;border-radius:4px;font-size:10px;margin-right:4px"><option value="">Ordu sec...</option></select><button class="btn-action" onclick="koloniFethet('+koloni.id+',true)" style="padding:6px 16px;font-size:12px;width:auto;border-color:#e74c3c;color:#ff6b6b">⚔️ Saldır</button>' : '') +
        (benimMi ? '<button class="btn-action" onclick="koloniCekil('+koloni.id+')" style="padding:6px 16px;font-size:12px;width:auto;border-color:#e74c3c;color:#e74c3c">🏳️ Çekil</button>' : '') +
      '</div>' +
      '<div id="koloni-msg" style="grid-column:1/-1;font-size:11px;text-align:center;min-height:16px"></div>';
    if (bos || (!bos && !benimMi)) setTimeout(koloniOrdulariYukle, 100);
  } else {
    const bolge = getBolge(x, y);
    title.textContent = '📋 Boş Alan (' + x + ':' + y + ')';
    content.innerHTML = '<div style="color:#555">' + (bolge ? bolge.id.replace(/_/g,' ') : 'Bilinmeyen') + ' bölgesi</div>';
  }

  // v1.9.3: Konuşlanan ordu bilgisi ekle
  if (konuslanan) {
    content.innerHTML += '<div style="grid-column:1/-1;margin-top:6px;padding:6px 8px;background:rgba(155,89,182,.1);border:1px solid #9b59b633;border-radius:4px">' +
      '<span style="color:#9b59b6;font-size:10px;font-weight:bold">⛨ Ordunuz Konuslandi</span><br>' +
      '<span style="color:#ccc;font-size:10px">' + (konuslanan.army_isim||'Ordu') + '</span>' +
      (konuslanan.hedef_kral ? '<span style="color:#888;font-size:11px"> → ' + konuslanan.hedef_kral + '</span>' : '') +
    '</div>';
  }
}

// ═══════════════════════════════════
// KOLONİ FETİH & ÇEKİL
// ═══════════════════════════════════
// Koloni paneli acildiginda ordulari yukle
async function koloniOrdulariYukle() {
  const token = getToken(); if (!token) return;
  const sel = document.getElementById('koloni-ordu-sec');
  if (!sel) return;
  try {
    const resp = await fetch(API_BASE + '/api/army/state', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!resp.ok) return;
    const data = await resp.json();
    const ordular = data.armies || [];
    // Sadece sehirde olan ordular (simdilik hepsi sehirde)
    sel.innerHTML = '<option value="">Ordu sec...</option>' +
      ordular.map(o => `<option value="ordu_${o.id}">${o.isim} (${o.total_units||0} unite)</option>`).join('');
    if (ordular.length === 0) {
      sel.innerHTML = '<option value="">Ordu yok!</option>';
    }
  } catch(e) {}
}

async function koloniFethet(koloniId, sahipli) {
  const token = getToken();
  if (!token) return;
  const msgEl = document.getElementById('koloni-msg');
  const orduSel = document.getElementById('koloni-ordu-sec');
  const orduId = orduSel ? orduSel.value : '';
  if (!orduId) { if (msgEl) msgEl.innerHTML = '<span style="color:#e74c3c">Once ordu secin!</span>'; return; }

  // Sahipli koloni → savas API, bos koloni → direkt fetih
  const endpoint = sahipli
    ? API_BASE + '/api/savas/koloni'
    : API_BASE + '/api/koloni/' + koloniId + '/fethet';

  // orduId "ordu_3" formatinda → savas API icin armies tablosundaki gercek id gerekli
  let bodyData;
  if (sahipli) {
    // ORDULAR dizisinden gercek army id'yi bul
    const orduIdx = parseInt(orduId.replace('ordu_', '')) - 1;
    const army = (typeof ORDULAR !== 'undefined' && ORDULAR[orduIdx]) ? ORDULAR[orduIdx] : null;
    if (!army) { if (msgEl) msgEl.innerHTML = '<span style="color:#e74c3c">Ordu bulunamadi!</span>'; return; }
    bodyData = { orduId: army.id, koloniId: koloniId };
  } else {
    bodyData = { orduId: orduId };
  }

  try {
    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(bodyData)
    });
    const data = await resp.json();
    if (resp.ok) {
      if (sahipli && data.tur_detay) {
        // Savas sonucu — rapor goster
        showSavasRapor(data, 'saldiran', {
          saldiranAdi: (typeof OYUNCU !== 'undefined' ? OYUNCU.kral : 'Sen'),
          savunanAdi: 'Koloni Sahibi',
          tip: 'koloni'
        });
        if (data.kazanan === 'saldiran') {
          if (msgEl) msgEl.innerHTML = '<span style="color:#2ecc71">Savas kazanildi! Koloni fethedildi!</span>';
        } else {
          if (msgEl) msgEl.innerHTML = '<span style="color:#e74c3c">Savas kaybedildi!</span>';
        }
      } else {
        if (msgEl) msgEl.innerHTML = '<span style="color:#2ecc71">Koloni fethedildi!</span>';
        if (typeof showToast === 'function') showToast('Koloni fethedildi!', 'success');
      }
      setTimeout(function() { loadMapData(); }, 2000);
    } else {
      if (msgEl) msgEl.innerHTML = '<span style="color:#e74c3c">' + (data.error || 'Hata') + '</span>';
    }
  } catch(e) {
    if (msgEl) msgEl.innerHTML = '<span style="color:#e74c3c">Baglanti hatasi</span>';
  }
}

async function koloniCekil(koloniId) {
  if (!confirm('Bu koloniden çekilmek istediğinize emin misiniz?')) return;
  const token = getToken();
  if (!token) return;
  const msgEl = document.getElementById('koloni-msg');
  try {
    const resp = await fetch(API_BASE + '/api/koloni/' + koloniId + '/cekil', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }
    });
    const data = await resp.json();
    if (resp.ok) {
      if (msgEl) msgEl.innerHTML = '<span style="color:#f39c12">Koloniden çekildiniz.</span>';
      if (typeof showToast === 'function') showToast('Koloniden çekildiniz', 'warning');
      setTimeout(() => loadMapData(), 1500);
    } else {
      if (msgEl) msgEl.innerHTML = '<span style="color:#e74c3c">' + (data.error || 'Hata') + '</span>';
    }
  } catch(e) {
    if (msgEl) msgEl.innerHTML = '<span style="color:#e74c3c">Bağlantı hatası</span>';
  }
}

function mapSayfa(s) {
  MAP_SAYFA = Math.max(1, Math.min(20, s));
  // Tile cache temizle (bellek yönetimi)
  Object.keys(TILE_CACHE).forEach(k => delete TILE_CACHE[k]);
  mapYukle();
}
function mapGitInput() {
  const inp = document.getElementById('map-git-input');
  if (inp) mapSayfa(parseInt(inp.value) || 1);
}
