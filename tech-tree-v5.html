<script>
// ════════════════════════════════════════════════════════════
// VERİ (backend SEHIR_GEL + askeri_gel + units.js'ten)
// ════════════════════════════════════════════════════════════
const oyuncuCag = 3;              // mock: oyuncu çağı
const seviyeler = {               // mock: oyuncunun mevcut seviyeleri
  oduncu_gel:5, madenci_gel:3, ciftci_gel:4, balikci_gel:2, ticaret_gel:1,
  kereste_gel:3, metal_gel:2, firin_gel:1, et_gel:0,
  vergi_gel:2, insaat_gel:1, essek_gel:0,
  ahir_gel:1, lonca_gel:0, buyulu_gel:0,
  askeri_gel:3, maas_gel:2, mana_gel:1,
  piyade_atk:4, piyade_def:3,
  sovalye_atk:2, sovalye_def:1,
  buyucu_atk:1, buyucu_def:0,
};

// Maliyet formülleri (backend'le aynı)
function sehirGelMaliyet(kademe) { return { gp: 5*kademe, kp: 2*kademe, isl: 100*kademe }; }
function askeriMaliyet(kademe)   { return { gp:10*kademe, kp: 5*kademe, isl: 100*kademe }; }
// Çağ kilidi (kademe 1-2→Ç1, 3-4→Ç2, ...)
function gerekenCag(kademe) { return Math.ceil(kademe / 2); }

// ŞEHIR GELIŞTIRMELERİ (16 adet, max kademe 10)
const SEHIR_GEL = {
  // KAYNAK
  oduncu_gel:    { isim:'Oduncu',         icon:'forest',     etki:'Oduncu→odun +%1/sv',     max:10, dal:'hammadde' },
  madenci_gel:   { isim:'Madenci',        icon:'construction',etki:'Madenci→metal +%1/sv',  max:10, dal:'hammadde' },
  ciftci_gel:    { isim:'Çiftçi',         icon:'agriculture',etki:'Çiftçi→buğday +%1/sv',  max:10, dal:'hammadde' },
  balikci_gel:   { isim:'Balıkçı',        icon:'set_meal',   etki:'Balıkçı→balık +%1/sv',  max:10, dal:'hammadde' },
  ticaret_gel:   { isim:'Ticaret',        icon:'storefront', etki:'Markette değerli +%1/sv', max:10, dal:'hammadde' },
  // İŞLEME
  kereste_gel:   { isim:'Kereste',        icon:'park',       etki:'Kereste verimi +%1/sv', max:10, dal:'isleme' },
  metal_gel:     { isim:'Metal İşleme',   icon:'handyman',   etki:'İşlenmiş metal +%1/sv', max:10, dal:'isleme' },
  firin_gel:     { isim:'Fırın',          icon:'restaurant', etki:'Ekmek+pişmiş +%1/sv',   max:10, dal:'isleme' },
  et_gel:        { isim:'Et İşleme',      icon:'lunch_dining',etki:'Pişmiş et verimi +%1/sv', max:10, dal:'isleme' },
  // EKONOMİ
  vergi_gel:     { isim:'Vergi Toleransı',icon:'payments',   etki:'Vergi moral cezası -%1/sv', max:10, dal:'ekonomi' },
  insaat_gel:    { isim:'İnşaat',         icon:'engineering',etki:'Bina maliyeti -%1/sv',  max:10, dal:'ekonomi' },
  essek_gel:     { isim:'Eşşek Şansı',    icon:'pets',       etki:'Pazarda eşşek +%0.1/sv',max:10, dal:'ekonomi' },
  // ŞEHIR YAPI (Askeri kategori)
  ahir_gel:      { isim:'Ahır',           icon:'shield_moon',etki:'At/Kurt üretim +%1/sv', max:10, dal:'yapi' },
  lonca_gel:     { isim:'Lonca',          icon:'visibility_off',etki:'Gizlilik +%1/sv',   max:10, dal:'yapi' },
  buyulu_gel:    { isim:'Büyülü Tarla',   icon:'egg',        etki:'Büyülü yumurta +%1/sv', max:10, dal:'yapi' },
  // MİSTİK
  mana_gel:      { isim:'Mana Verimi',    icon:'auto_fix_high',etki:'Worshipper mana +%1/sv',max:10, dal:'mistik' },
};

// ASKERİ GELİŞTİRME (max sv = çağ × 3, üst sınır 15)
const ASKERI_GEL = {
  askeri_gel: { isim:'Askeri Geliştirme', icon:'shield',  etki:'Ünite eğitim altın -%10/sv', max:15, dal:'askeri' },
  maas_gel:   { isim:'Maaş İndirimi',     icon:'paid',    etki:'Ordu maaşı -%5/sv',          max:15, dal:'askeri' },
};

// ÇAĞ ATLAMA (4 atlama: 1→2, 2→3, 3→4, 4→5)
const CAG_ATLA = [
  { isim:'II. Çağ — Demir',   icon:'looks_two',   gp:30,  kp:15, isl:500,   dal:'mistik' },
  { isim:'III. Çağ — Altın',  icon:'looks_3',     gp:80,  kp:40, isl:1500,  dal:'mistik' },
  { isim:'IV. Çağ — Ejderha', icon:'looks_4',     gp:200, kp:100,isl:5000,  dal:'mistik' },
  { isim:'V. Çağ — Kadim',    icon:'looks_5',     gp:500, kp:250,isl:15000, dal:'mistik' },
];

// BİRİM ATK/DEF (örnek 3 birim — backend'de 28 ünite × 2 = 56 var)
const BIRIM_GEL = {
  piyade_atk:   { isim:'Piyade ATK',   icon:'gpp_good',  etki:'Piyade ATK +1/sv',    max:10, dal:'birim' },
  piyade_def:   { isim:'Piyade DEF',   icon:'gpp_maybe', etki:'Piyade DEF +1/sv',    max:10, dal:'birim' },
  sovalye_atk:  { isim:'Şövalye ATK',  icon:'gpp_good',  etki:'Şövalye ATK +1/sv',   max:10, dal:'birim' },
  sovalye_def:  { isim:'Şövalye DEF',  icon:'gpp_maybe', etki:'Şövalye DEF +1/sv',   max:10, dal:'birim' },
  buyucu_atk:   { isim:'Büyücü ATK',   icon:'gpp_good',  etki:'Büyücü ATK +1/sv',    max:10, dal:'birim' },
  buyucu_def:   { isim:'Büyücü DEF',   icon:'gpp_maybe', etki:'Büyücü DEF +1/sv',    max:10, dal:'birim' },
};

// ════════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════════
function kart(opts) {
  const { id, isim, icon, etki, sv, maxSv, costFn, gerekenCag: gc, oyuncuCag: oc } = opts;
  const bought    = sv > 0;
  const current   = sv < maxSv;
  const cagYeter  = oc >= gc;
  const sonraki   = sv + 1;
  const cost      = costFn ? costFn(sonraki) : null;
  const locked    = !cagYeter || sv >= maxSv;
  // Card class
  let bg, br, opacity = '';
  if (sv >= maxSv) { bg = 'bg-surface-container-high'; br = 'border-primary'; }
  else if (locked) { bg = 'bg-surface-container-lowest'; br = 'border-outline-variant/30'; opacity = 'opacity-30'; }
  else             { bg = 'bg-surface-container-high'; br = 'border-primary/30'; }
  const titleColor = (sv >= maxSv || (bought && !locked)) ? 'text-primary' : 'text-on-surface';
  const iconColor  = (sv >= maxSv) ? 'text-primary' : (bought ? 'text-primary/70' : 'text-on-surface-variant');

  let costHtml = '';
  if (sv >= maxSv) {
    costHtml = `<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings:'FILL' 1;">check_circle</span>`;
  } else if (locked && !cagYeter) {
    costHtml = `<span class="text-[9px] text-on-surface-variant leading-tight">Çağ ${gc} gerek</span>`;
  } else if (cost) {
    costHtml = `<span class="text-[9px] text-primary leading-tight">${cost.gp}GP·${cost.kp}KP</span>`;
  }

  return `<div class="w-full h-[44px] ${bg} border ${br} rounded-md flex items-center px-3 gap-2 relative hover:border-primary transition-all cursor-pointer ${opacity}" title="${etki}">
    <span class="material-symbols-outlined ${iconColor} text-sm">${icon}</span>
    <div class="flex-grow flex flex-col justify-center min-w-0">
      <span class="text-[10px] font-bold ${titleColor} leading-tight truncate">${isim}${sv > 0 ? ` (Sv ${sv})` : ''}</span>
      <span class="text-[9px] text-on-surface-variant leading-tight truncate">${etki}</span>
    </div>
    ${costHtml}
  </div>`;
}

function renderDal(domId, items, kademeKey) {
  const el = document.getElementById(domId);
  if (!el) return;
  // Her geliştirme TEK kart (mevcut Sv X / Max Y gösterir)
  el.innerHTML = items.map((it, idx) => {
    const sep = (idx > 0) ? `<div class="w-0.5 h-3 bg-primary/30"></div>` : '';
    return sep + it;
  }).join('');
}

// Doldur
document.addEventListener('DOMContentLoaded', () => {
  // HAMMADDE
  renderDal('dal-hammadde', Object.entries(SEHIR_GEL).filter(([,v]) => v.dal === 'hammadde').map(([id, v]) =>
    kart({ id, isim: v.isim, icon: v.icon, etki: v.etki, sv: seviyeler[id] || 0, maxSv: v.max, costFn: sehirGelMaliyet, gerekenCag: gerekenCag((seviyeler[id]||0)+1), oyuncuCag })
  ));
  // İŞLEME
  renderDal('dal-isleme', Object.entries(SEHIR_GEL).filter(([,v]) => v.dal === 'isleme').map(([id, v]) =>
    kart({ id, isim: v.isim, icon: v.icon, etki: v.etki, sv: seviyeler[id] || 0, maxSv: v.max, costFn: sehirGelMaliyet, gerekenCag: gerekenCag((seviyeler[id]||0)+1), oyuncuCag })
  ));
  // EKONOMİ
  renderDal('dal-ekonomi', Object.entries(SEHIR_GEL).filter(([,v]) => v.dal === 'ekonomi').map(([id, v]) =>
    kart({ id, isim: v.isim, icon: v.icon, etki: v.etki, sv: seviyeler[id] || 0, maxSv: v.max, costFn: sehirGelMaliyet, gerekenCag: gerekenCag((seviyeler[id]||0)+1), oyuncuCag })
  ));
  // YAPI (Ahır/Lonca/Büyülü)
  renderDal('dal-yapi', Object.entries(SEHIR_GEL).filter(([,v]) => v.dal === 'yapi').map(([id, v]) =>
    kart({ id, isim: v.isim, icon: v.icon, etki: v.etki, sv: seviyeler[id] || 0, maxSv: v.max, costFn: sehirGelMaliyet, gerekenCag: gerekenCag((seviyeler[id]||0)+1), oyuncuCag })
  ));
  // ASKERİ
  const askeriItems = Object.entries(ASKERI_GEL).map(([id, v]) =>
    kart({ id, isim: v.isim, icon: v.icon, etki: v.etki, sv: seviyeler[id] || 0,
           maxSv: Math.min(oyuncuCag * 3, v.max),
           costFn: askeriMaliyet, gerekenCag: 1, oyuncuCag })
  );
  renderDal('dal-askeri', askeriItems);
  // MİSTİK (mana + 4 çağ atlama)
  const mistikItems = [];
  const manaItem = SEHIR_GEL.mana_gel;
  mistikItems.push(kart({ id:'mana_gel', isim:manaItem.isim, icon:manaItem.icon, etki:manaItem.etki,
                          sv:seviyeler.mana_gel || 0, maxSv:manaItem.max, costFn:sehirGelMaliyet,
                          gerekenCag: gerekenCag((seviyeler.mana_gel||0)+1), oyuncuCag }));
  // Çağ atlama (her biri tek seferlik, sv ya 0 ya 1)
  CAG_ATLA.forEach((ca, idx) => {
    const hedefCag = idx + 2;
    const bought = oyuncuCag >= hedefCag;
    const locked = oyuncuCag < (hedefCag - 1);
    mistikItems.push(`<div class="w-full h-[44px] ${bought ? 'bg-surface-container-high border-primary' : (locked ? 'bg-surface-container-lowest border-outline-variant/30 opacity-30' : 'bg-surface-container-high border-primary/30')} border rounded-md flex items-center px-3 gap-2 relative hover:border-primary transition-all cursor-pointer" title="${ca.gp} GP + ${ca.kp} KP + ${ca.isl} İşl gerek">
      <span class="material-symbols-outlined ${bought ? 'text-primary' : 'text-on-surface-variant'} text-sm">${ca.icon}</span>
      <div class="flex-grow flex flex-col justify-center min-w-0">
        <span class="text-[10px] font-bold ${bought ? 'text-primary' : 'text-on-surface'} leading-tight truncate">${ca.isim}</span>
        <span class="text-[9px] text-on-surface-variant leading-tight truncate">Çağ atlama</span>
      </div>
      ${bought ? `<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings:'FILL' 1;">check_circle</span>` : `<span class="text-[9px] text-primary leading-tight">${ca.gp}GP·${ca.kp}KP</span>`}
    </div>`);
  });
  renderDal('dal-mistik', mistikItems);
  // BİRİM (örnek 3 birim — backend'de 26)
  renderDal('dal-birim', Object.entries(BIRIM_GEL).map(([id, v]) =>
    kart({ id, isim: v.isim, icon: v.icon, etki: v.etki, sv: seviyeler[id] || 0,
           maxSv: v.max, costFn: askeriMaliyet, gerekenCag: 1, oyuncuCag })
  ));

  // Filter chip handler
  const chips = document.querySelectorAll('.filter-chip');
  const cols = document.querySelectorAll('.tree-col');
  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      chips.forEach(c => {
        c.classList.remove('active','bg-primary/10','text-primary','border-primary');
        c.classList.add('border-outline-variant','text-on-surface-variant');
      });
      chip.classList.add('active','bg-primary/10','text-primary','border-primary');
      chip.classList.remove('border-outline-variant','text-on-surface-variant');
      const f = chip.dataset.filter;
      cols.forEach(col => {
        const c = col.dataset.col;
        let show;
        if (f === 'hepsi') show = true;
        else if (f === 'gp') show = (c === 'gp' || c === 'karma');
        else if (f === 'kp') show = (c === 'kp' || c === 'karma');
        col.style.display = show ? 'flex' : 'none';
      });
    });
  });
});
</script>
</body></html>
