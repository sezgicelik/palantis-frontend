<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noxara — Tech Tree Mockup Sekmeleri</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Orbitron:wght@500;700&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:#050203; color:#e8dcc4; font-family:'Cinzel',serif; overflow:hidden; }

  .topbar {
    display:flex; align-items:center; gap:12px;
    padding:8px 16px;
    background: linear-gradient(180deg, #1a0c14 0%, #0a0604 100%);
    border-bottom: 1px solid #3a3020;
    height: 56px;
    flex-shrink: 0;
  }
  .title {
    color:#d4af37;
    font-size:14px;
    letter-spacing:3px;
    font-weight:700;
    white-space: nowrap;
  }
  .tabs {
    display:flex;
    gap:6px;
    flex:1;
    overflow-x:auto;
    padding: 0 8px;
  }
  .tab {
    padding: 8px 16px;
    border: 1px solid #3a3020;
    background: transparent;
    color: #888;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 4px;
    transition: all .15s;
    white-space: nowrap;
    font-weight: 600;
  }
  .tab:hover {
    border-color: #d4af37;
    color: #d4af37;
  }
  .tab.active { color: #0a0604; font-weight: 700; }
  .tab.active.v1 { background: #d4af37; border-color: #d4af37; }
  .tab.active.v2 { background: #00e5ff; border-color: #00e5ff; }
  .tab.active.v3 { background: #ff6818; border-color: #ff6818; }
  .tab.active.v4 { background: #c8a04a; border-color: #c8a04a; }
  .tab.active.v5 { background: #f3bd6f; border-color: #f3bd6f; color: #442b00; }
  .tab.v5-new { border-color: #f3bd6f; color: #f3bd6f; }

  .tab .badge {
    display: inline-block;
    margin-left: 4px;
    padding: 1px 6px;
    background: rgba(0,0,0,0.3);
    border-radius: 3px;
    font-size: 9px;
    letter-spacing: 0.5px;
  }

  .iframe-wrap {
    width: 100%;
    height: calc(100vh - 56px);
    background: #050203;
    overflow: auto;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  /* Mobil */
  @media (max-width: 720px) {
    .topbar { flex-direction: column; height: auto; align-items: stretch; padding: 8px; gap: 6px; }
    .title { text-align: center; font-size: 12px; letter-spacing: 2px; }
    .tabs { padding: 0; }
    .tab { padding: 6px 10px; font-size: 10px; letter-spacing: 1px; }
    .iframe-wrap { height: calc(100vh - 110px); }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="title">📜 NOXARA TECH TREE</div>
  <div class="tabs" id="tab-bar">
    <button class="tab v5 active v5-new" data-v="v5" data-src="tech-tree-v5.html">V5 — GP/KP Dallar <span class="badge">🆕 önerim</span></button>
    <button class="tab v1" data-v="v1" data-src="tech-tree-mockup.html">V1 — Klasik <span class="badge">altın</span></button>
    <button class="tab v2"        data-v="v2" data-src="tech-tree-mockup-v2.html">V2 — Cyberpunk <span class="badge">neon</span></button>
    <button class="tab v3"        data-v="v3" data-src="tech-tree-mockup-v3.html">V3 — Ejder <span class="badge">gotik</span></button>
    <button class="tab v4"        data-v="v4" data-src="tech-tree-mockup-v4.html">V4 — Bilgelik Ağacı <span class="badge">en detaylı</span></button>
  </div>
</div>

<div class="iframe-wrap">
  <iframe id="mock-frame" src="tech-tree-v5.html" loading="eager" title="Tech Tree Mockup"></iframe>
</div>

<script>
  const tabBar = document.getElementById('tab-bar');
  const frame = document.getElementById('mock-frame');

  tabBar.addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    // active sınıfı switch
    tabBar.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    // iframe src değiştir
    const src = btn.dataset.src;
    if (frame.src.split('/').pop().split('?')[0] !== src) {
      frame.src = src;
    }
    // URL hash güncelle (paylaşılabilir)
    history.replaceState(null, '', '#' + btn.dataset.v);
  });

  // Sayfa yüklenirken hash kontrolü (örn. #v3 ile direkt v3'e açılsın)
  function applyHash() {
    const v = location.hash.replace('#', '').toLowerCase();
    if (v && ['v1','v2','v3','v4','v5'].includes(v)) {
      const btn = tabBar.querySelector(`.tab[data-v="${v}"]`);
      if (btn) btn.click();
    }
  }
  window.addEventListener('hashchange', applyHash);
  applyHash();
</script>

</body>
</html>
