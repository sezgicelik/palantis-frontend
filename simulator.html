<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palantis — Savaş Simulatörü</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@0;1&display=swap');

:root {
  --ink:#0A0805; --stone:#1C160E; --fog:#2C2418; --border:#3D3020;
  --gold:#C9A84C; --gold-dim:#7A5928; --gold-bright:#F0C96A;
  --ember:#C45A2A; --text:#E8D5A3; --text-dim:#7A6848;
  --atk-col:#C45A3A; --def-col:#3A7EC4; --res-col:#7AC47A;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--ink);color:var(--text);font-family:'IM Fell English',Georgia,serif;min-height:100vh;
  background-image:radial-gradient(ellipse at 15% 50%,rgba(139,26,26,.06) 0%,transparent 50%),radial-gradient(ellipse at 85% 30%,rgba(58,126,196,.05) 0%,transparent 40%);}

header{text-align:center;padding:24px 20px 14px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(201,168,76,.06) 0%,transparent 100%);}
.title{font-family:'Cinzel Decorative',serif;font-size:clamp(1.1rem,3vw,1.8rem);color:var(--gold);letter-spacing:4px;text-shadow:0 0 20px rgba(201,168,76,.3);}
.subtitle{font-family:'Cinzel',serif;font-size:.58rem;color:var(--text-dim);letter-spacing:6px;margin-top:4px;}

.main{display:grid;grid-template-columns:1fr 1fr;max-width:1400px;margin:0 auto;}
.panel{padding:16px 20px;border-right:1px solid var(--border);}
.panel:last-child{border-right:none;}
.panel-title{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:4px;color:var(--gold-dim);text-transform:uppercase;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.badge{padding:2px 8px;border-radius:1px;font-size:.52rem;letter-spacing:2px;}
.dark-badge{background:rgba(139,26,26,.3);color:#C45A5A;border:1px solid rgba(139,26,26,.4);}
.light-badge{background:rgba(58,126,196,.2);color:#7AB4E8;border:1px solid rgba(58,126,196,.3);}

.formation-wrap{margin-bottom:14px;}
.formation-label{font-family:'Cinzel',serif;font-size:.55rem;color:var(--text-dim);letter-spacing:3px;margin-bottom:6px;text-transform:uppercase;}
.formation{display:flex;flex-direction:column;gap:0;border:1px solid var(--border);border-radius:2px;padding:8px;background:var(--stone);}
.saf-block{margin-bottom:4px;}
.saf-row{display:flex;gap:4px;align-items:stretch;}
.saf-label-col{width:44px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;}
.saf-num{font-family:'Cinzel',serif;font-size:.5rem;color:var(--gold-dim);}
.saf-slots{display:flex;gap:4px;flex:1;}
.saf-tip{font-size:.46rem;color:var(--text-dim);font-style:italic;padding:2px 4px 4px 50px;line-height:1.4;}

.slot{flex:1;height:58px;border:1px dashed var(--border);border-radius:2px;background:#0D0A06;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:border-color .12s,background .12s;overflow:hidden;user-select:none;}
.slot:hover{border-color:var(--gold-dim);background:#1A1408;}
.slot.filled{border-style:solid;}
.slot.dark-slot.filled{border-color:rgba(139,26,26,.5);}
.slot.light-slot.filled{border-color:rgba(58,126,196,.4);}
.slot.selected{border-color:var(--gold)!important;box-shadow:0 0 0 1px var(--gold);background:#221A08!important;}
.slot.drag-over{border-color:var(--gold-bright)!important;background:rgba(201,168,76,.1)!important;border-style:solid!important;}
.slot.drag-src{opacity:.35;}
.slot-name{font-family:'Cinzel',serif;font-size:.5rem;color:var(--text);text-align:center;line-height:1.2;padding:0 2px;}
.slot-count{font-size:.56rem;color:var(--gold);font-family:'Cinzel',serif;}
.slot-stats{font-size:.43rem;display:flex;gap:4px;}
.s-atk{color:var(--atk-col);}
.s-def{color:var(--def-col);}
.slot-empty{font-size:.42rem;color:var(--border);text-align:center;}
.slot-hint{font-size:.37rem;color:var(--border);margin-top:2px;}

.unit-picker{margin-bottom:12px;}
.picker-tabs{display:flex;gap:3px;margin-bottom:8px;flex-wrap:wrap;}
.picker-tab{font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:2px;padding:3px 9px;border:1px solid var(--border);border-radius:1px;cursor:pointer;background:none;color:var(--text-dim);transition:all .12s;}
.picker-tab:hover,.picker-tab.active{border-color:var(--gold);color:var(--gold);}
.unit-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:3px;max-height:190px;overflow-y:auto;}
.unit-list::-webkit-scrollbar{width:3px;}
.unit-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.unit-item{padding:5px 7px;border:1px solid var(--border);border-radius:2px;cursor:grab;background:var(--stone);transition:all .12s;display:flex;flex-direction:column;gap:2px;position:relative;}
.unit-item:hover:not(.used){border-color:var(--gold-dim);background:var(--fog);}
.unit-item.sel{border-color:var(--gold);background:var(--fog);}
.unit-item.used{opacity:.3;cursor:not-allowed;pointer-events:none;}
.unit-item.used::after{content:'KULLANILDI';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:.38rem;letter-spacing:1px;color:var(--text-dim);background:rgba(0,0,0,.55);}
.ui-name{font-family:'Cinzel',serif;font-size:.52rem;color:var(--text);line-height:1.2;}
.ui-stats{font-size:.44rem;display:flex;gap:5px;}
.tdot{display:inline-block;width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:2px;}
.t-dragon{background:#C9A84C;box-shadow:0 0 4px rgba(201,168,76,.6);}
.t-elite{background:#8B1A9A;}
.t-heavy{background:#C45A2A;}
.t-mid{background:#3A7EC4;}
.t-light{background:#4A6848;}
.t-priest{background:#7AC47A;}

.count-row{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.count-label{font-family:'Cinzel',serif;font-size:.55rem;color:var(--text-dim);letter-spacing:2px;}
.count-input{font-family:'Cinzel',serif;font-size:.72rem;color:var(--gold);background:var(--stone);border:1px solid var(--border);border-radius:2px;padding:4px 8px;width:90px;text-align:center;}
.count-input:focus{outline:none;border-color:var(--gold-dim);}
.btn{font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:2px;padding:5px 11px;border-radius:1px;cursor:pointer;transition:all .15s;}
.btn-place{border:1px solid var(--gold-dim);background:rgba(201,168,76,.1);color:var(--gold);}
.btn-place:hover{background:rgba(201,168,76,.2);border-color:var(--gold);}
.btn-clr{border:1px solid var(--border);background:none;color:var(--text-dim);}
.btn-clr:hover{border-color:var(--ember);color:#C45A5A;}

.ordu-ozet{background:var(--stone);border:1px solid var(--border);border-radius:2px;padding:10px 12px;margin-bottom:12px;}
.oz-row{display:flex;justify-content:space-between;font-size:.63rem;margin-bottom:3px;}
.oz-k{color:var(--text-dim);}
.oz-v{font-family:'Cinzel',serif;}
.oz-atk{color:var(--atk-col);}
.oz-def{color:var(--def-col);}

.battle-section{border-top:1px solid var(--border);padding:20px;text-align:center;background:linear-gradient(180deg,rgba(201,168,76,.03) 0%,transparent 100%);}
.btn-battle{font-family:'Cinzel Decorative',serif;font-size:.82rem;letter-spacing:3px;padding:13px 36px;border:2px solid var(--gold-dim);border-radius:2px;background:linear-gradient(135deg,rgba(201,168,76,.15),rgba(201,168,76,.05));color:var(--gold);cursor:pointer;transition:all .2s;}
.btn-battle:hover{border-color:var(--gold);box-shadow:0 0 20px rgba(201,168,76,.15);}
.qresult{margin-top:14px;display:none;}
.qresult.show{display:block;}
.qbanner{padding:11px 20px;border-radius:2px;font-family:'Cinzel Decorative',serif;font-size:.82rem;letter-spacing:2px;margin-bottom:10px;}
.r-dk{background:rgba(139,26,26,.2);border:1px solid rgba(139,26,26,.4);color:#E8A0A0;}
.r-lt{background:rgba(58,126,196,.15);border:1px solid rgba(58,126,196,.3);color:#A0C8F0;}
.r-dr{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);color:var(--gold);}
.btn-rapor{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:2px;padding:9px 22px;border:1px solid var(--gold-dim);border-radius:1px;background:rgba(201,168,76,.08);color:var(--gold);cursor:pointer;transition:all .15s;margin-top:6px;}
.btn-rapor:hover{background:rgba(201,168,76,.18);border-color:var(--gold);}

.tt{position:fixed;background:var(--stone);border:1px solid var(--gold-dim);border-radius:2px;padding:9px 11px;font-size:.6rem;pointer-events:none;z-index:3000;display:none;min-width:150px;box-shadow:0 8px 24px rgba(0,0,0,.7);}
.tt-nm{font-family:'Cinzel',serif;color:var(--gold);margin-bottom:5px;font-size:.65rem;}
.tt-r{display:flex;justify-content:space-between;gap:14px;margin-bottom:2px;color:var(--text-dim);}
.tt-r span:last-child{color:var(--text);font-family:'Cinzel',serif;}
.tt-d{margin-top:5px;color:var(--text-dim);font-size:.54rem;font-style:italic;}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:2000;overflow-y:auto;padding:20px;}
.modal-bg.open{display:flex;align-items:flex-start;justify-content:center;}
.modal-box{background:var(--stone);border:1px solid var(--gold-dim);border-radius:3px;width:100%;max-width:920px;padding:26px 30px;position:relative;}
.m-close{position:absolute;top:12px;right:12px;font-family:'Cinzel',serif;font-size:.56rem;letter-spacing:2px;padding:5px 10px;border:1px solid var(--border);border-radius:1px;background:none;color:var(--text-dim);cursor:pointer;}
.m-close:hover{border-color:var(--ember);color:#C45A5A;}
.m-print{position:absolute;top:12px;right:90px;font-family:'Cinzel',serif;font-size:.56rem;letter-spacing:2px;padding:5px 12px;border:1px solid var(--gold-dim);border-radius:1px;background:rgba(201,168,76,.1);color:var(--gold);cursor:pointer;}
.rp-title{font-family:'Cinzel Decorative',serif;font-size:1.05rem;color:var(--gold);text-align:center;letter-spacing:3px;margin-bottom:3px;}
.rp-sub{font-family:'Cinzel',serif;font-size:.54rem;letter-spacing:5px;color:var(--text-dim);text-align:center;margin-bottom:16px;text-transform:uppercase;}
.rp-div{height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);margin:12px 0;}
.rp-sec{font-family:'Cinzel',serif;font-size:.56rem;letter-spacing:4px;color:var(--gold-dim);text-transform:uppercase;margin-bottom:10px;}

.rp-result{text-align:center;padding:11px;border-radius:2px;margin:12px 0;font-family:'Cinzel Decorative',serif;font-size:.82rem;letter-spacing:2px;}
.rr-dk{background:rgba(139,26,26,.2);border:1px solid rgba(139,26,26,.4);color:#E8A0A0;}
.rr-lt{background:rgba(58,126,196,.15);border:1px solid rgba(58,126,196,.3);color:#A0C8F0;}
.rr-dr{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);color:var(--gold);}

.rp-cards{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:12px;}
.rp-card{background:var(--ink);border:1px solid var(--border);border-radius:2px;padding:11px 13px;}
.rp-card.dk{border-color:rgba(139,26,26,.4);}
.rp-card.lt{border-color:rgba(58,126,196,.35);}
.rp-cn{font-family:'Cinzel',serif;font-size:.7rem;margin-bottom:8px;}
.dk .rp-cn{color:#E8A0A0;} .lt .rp-cn{color:#A0C8F0;}
.rp-st{display:flex;justify-content:space-between;font-size:.6rem;margin-bottom:3px;}
.rp-sk{color:var(--text-dim);} .rp-sv{font-family:'Cinzel',serif;color:var(--text);}
.rp-vs{font-family:'Cinzel Decorative',serif;font-size:.72rem;color:var(--gold-dim);text-align:center;}

/* Tur Tablosu */
.rp-twrap{overflow-x:auto;margin-bottom:14px;}
.rp-tt{width:100%;border-collapse:collapse;font-size:.6rem;white-space:nowrap;}
.rp-tt th{font-family:'Cinzel',serif;font-size:.48rem;letter-spacing:1.5px;color:var(--text-dim);padding:5px 7px;border-bottom:1px solid var(--border);text-align:center;text-transform:uppercase;background:var(--fog);}
.rp-tt td{padding:5px 7px;border-bottom:1px solid rgba(44,36,24,.7);text-align:center;font-family:'Cinzel',serif;font-size:.58rem;}
.rp-tt tr:hover td{background:rgba(201,168,76,.02);}
.td-t{color:var(--gold-dim);font-size:.62rem;font-weight:bold;}
.td-b{color:var(--text);}
.td-k{color:var(--atk-col);}
.td-di{color:var(--res-col);}
.td-sp{width:6px;background:rgba(61,48,32,.8);padding:0!important;}
.rp-tt tr.tr-s td{border-top:1px solid var(--gold-dim);background:rgba(201,168,76,.04);}
/* birim detay satırı */
.rp-tt tr.tr-detail td{padding:2px 7px 5px;font-size:.48rem;color:var(--text-dim);font-family:'IM Fell English',Georgia,serif;background:rgba(0,0,0,.25);border-bottom:1px solid rgba(61,48,32,.5);}

/* Birim Tablosu */
.rp-bgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.rp-bt{width:100%;border-collapse:collapse;font-size:.58rem;}
.rp-bt th{font-family:'Cinzel',serif;font-size:.48rem;letter-spacing:1px;color:var(--text-dim);padding:4px 5px;border-bottom:1px solid var(--border);text-align:left;}
.rp-bt th.r,.rp-bt td.r{text-align:right;}
.rp-bt td{padding:4px 5px;border-bottom:1px solid rgba(44,36,24,.5);color:var(--text-dim);}
.rp-bt td:first-child{font-family:'Cinzel',serif;font-size:.56rem;color:var(--text);}
.rp-bt td.tatk{text-align:right;color:var(--atk-col);}
.rp-bt td.tdef{text-align:right;color:var(--def-col);}

@media print{.m-close,.m-print{display:none!important;}.modal-bg{position:static;background:white;padding:0;}.modal-box{border:none;background:white;color:black;}body>*:not(.modal-bg){display:none!important;}}
@media(max-width:900px){.main{grid-template-columns:1fr;}.panel{border-right:none;border-bottom:1px solid var(--border);}.rp-cards{grid-template-columns:1fr;}.rp-vs{display:none;}.rp-bgrid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="tt" id="tt"></div>

<header>
  <div class="title">⚔ PALANTIS SAVAŞ SİMÜLATÖRÜ</div>
  <div class="subtitle">Saf Düzeni · Tur Bazlı Muharebe · Diriliş Sistemi</div>
</header>

<div class="main">
  <div class="panel">
    <div class="panel-title"><span class="badge dark-badge">KARANLIK</span>ORDU KURULUMU</div>
    <div class="formation-wrap">
      <div class="formation-label">SAF DÜZENİ — 13 Slot · 3+3+4+3 · Ön → Arka</div>
      <div class="formation" id="darkF"></div>
    </div>
    <div class="ordu-ozet">
      <div class="oz-row"><span class="oz-k">Toplam Birim</span><span class="oz-v" id="d-b">—</span></div>
      <div class="oz-row"><span class="oz-k">Toplam ATK</span><span class="oz-v oz-atk" id="d-a">—</span></div>
      <div class="oz-row"><span class="oz-k">Toplam DEF</span><span class="oz-v oz-def" id="d-d">—</span></div>
    </div>
    <div class="unit-picker">
      <div class="picker-tabs" id="darkTabs"></div>
      <div class="unit-list" id="darkList"></div>
    </div>
    <div class="count-row">
      <span class="count-label">SAYI</span>
      <input type="number" class="count-input" id="darkCnt" value="1000" min="1" max="999999">
      <button class="btn btn-place" onclick="placeUnit('dark')">YERLEŞTIR</button>
      <button class="btn btn-clr" onclick="clearSlot('dark')">TEMİZLE</button>
      <button class="btn btn-clr" style="font-size:.44rem" onclick="clearAll('dark')">TÜMÜNÜ SİL</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title"><span class="badge light-badge">AYDINLIK</span>ORDU KURULUMU</div>
    <div class="formation-wrap">
      <div class="formation-label">SAF DÜZENİ — 13 Slot · 3+3+4+3 · Ön → Arka</div>
      <div class="formation" id="lightF"></div>
    </div>
    <div class="ordu-ozet">
      <div class="oz-row"><span class="oz-k">Toplam Birim</span><span class="oz-v" id="l-b">—</span></div>
      <div class="oz-row"><span class="oz-k">Toplam ATK</span><span class="oz-v oz-atk" id="l-a">—</span></div>
      <div class="oz-row"><span class="oz-k">Toplam DEF</span><span class="oz-v oz-def" id="l-d">—</span></div>
    </div>
    <div class="unit-picker">
      <div class="picker-tabs" id="lightTabs"></div>
      <div class="unit-list" id="lightList"></div>
    </div>
    <div class="count-row">
      <span class="count-label">SAYI</span>
      <input type="number" class="count-input" id="lightCnt" value="1000" min="1" max="999999">
      <button class="btn btn-place" onclick="placeUnit('light')">YERLEŞTIR</button>
      <button class="btn btn-clr" onclick="clearSlot('light')">TEMİZLE</button>
      <button class="btn btn-clr" style="font-size:.44rem" onclick="clearAll('light')">TÜMÜNÜ SİL</button>
    </div>
  </div>
</div>

<div class="battle-section">
  <button class="btn-battle" onclick="simulate()">⚔ SAVAŞI BAŞLAT ⚔</button>
  <div class="qresult" id="qresult">
    <div class="qbanner" id="qbanner"></div>
    <button class="btn-rapor" onclick="openRapor()">📜 DETAYLI SAVAŞ RAPORUNU GÖR</button>
  </div>
</div>

<div class="modal-bg" id="raporModal">
  <div class="modal-box" id="raporBox"></div>
</div>

<script>
const UNITS={
  dark:[
    {name:'Siyah Ejderha',  atk:1000,def:5000,tier:'dragon',desc:'Güçlü Ejderha — Karanlık rengi. Siyah/Altın tipi.'},

    {name:'Kara Şovalye',   atk:14,  def:46,  tier:'heavy', desc:'Yüksek savunmalı ağır süvari. 2. veya 3. safta ideal.'},

    {name:'İskelet Okçu',   atk:10,  def:13,  tier:'mid',   desc:'Uzak mesafe karanlık destek. Arkasafta kullan.'},
    {name:'İskelet',        atk:5,   def:10,  tier:'light', desc:'En ucuz karanlık birim. 1. safta kalabalık yem.'},
    {name:'Goblin',         atk:6,   def:10,  tier:'light', desc:'Hafif dolgu birimi. 1. safta kullan.'},
    {name:'Asker',          atk:2,   def:1,   tier:'light', desc:'En zayıf birim. Yer tutucu.'},
    {name:'Kara Rahip',     atk:0,   def:4,   tier:'priest',desc:'⟳ DİRİLTİCİ. Her tur ölen birimleri geri getirir. 4. safta koru!'},
  ],
  light:[
    {name:'Altın Ejderha',    atk:1000,def:5000,tier:'dragon',desc:'Güçlü Ejderha — Aydınlık rengi. Siyah/Altın tipi.'},
    {name:'Mavi Ejderha',     atk:750, def:2500,tier:'dragon',desc:'Orta Ejderha — Aydınlık rengi. Kırmızı/Mavi tipi.'},
    {name:'Işığın Savaşçısı', atk:48,  def:100, tier:'elite', desc:'Gölge Savaşçısı\'nın tam dengi. Aydınlık tarafın eli.'},
    {name:'Paladin',          atk:15,  def:44,  tier:'heavy', desc:'Kutsal şovalye. Yüksek savunma.'},
    {name:'Kolcu',            atk:16,  def:40,  tier:'heavy', desc:'Ağır okçu. Savunmalı uzak hasar.'},
    {name:'Şovalye',          atk:13,  def:40,  tier:'heavy', desc:'Dengeli ağır süvari.'},
    {name:'Süvari',           atk:15,  def:30,  tier:'heavy', desc:'Hızlı orta sınıf.'},
    {name:'Savaşçı',          atk:11,  def:24,  tier:'mid',   desc:'Dengeli aydınlık birimi.'},
    {name:'Büyücü',           atk:18,  def:20,  tier:'mid',   desc:'Yüksek ATK, kırılgan. Arkasafta kullan.'},

};

const SAF=[3,3,4,3];
const SAF_TIPS={
  dark:['Yem & Kalkan → İskelet · Goblin · Ogre · Asker','Orta Ağır → Troll · Ork · Kara Şovalye','Hasar & Güç → Kara Elf · İskelet Okçu · Golem · Gölge Savaşçısı','Destek & Elit → Kara Rahip · Ejderha'],
  light:['Yem & Kalkan → Piyade · Baltacı · Asker · Süvari','Orta Ağır → Şovalye · Savaşçı · Kolcu','Hasar & Güç → Büyücü · Okçu · Işığın Savaşçısı · Paladin','Destek & Elit → Rahip · Ejderha']
};
const TABS={'Ejderha':['dragon'],'Elite':['elite'],'Ağır':['heavy'],'Orta':['mid'],'Hafif':['light'],'Rahip':['priest']};
const TCOL={dragon:'#C9A84C',elite:'#8B1A9A',heavy:'#C45A2A',mid:'#3A7EC4',light:'#4A6848',priest:'#7AC47A'};
const SLOTS=SAF.reduce((a,b)=>a+b,0);
const PRPU=4;

const ST={
  dark: {sl:Array(SLOTS).fill(null),sel:null,su:null,tab:'Ağır'},
  light:{sl:Array(SLOTS).fill(null),sel:null,su:null,tab:'Ağır'}
};
let lastB=null,dragD=null;

const fmt=n=>{if(!n)return'—';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(0)+'K';return n.toLocaleString('tr-TR');};

// ---- FORMATION ----
function buildF(side){
  const el=document.getElementById(side==='dark'?'darkF':'lightF');
  el.innerHTML='';
  let si=0;
  SAF.forEach((cnt,sn)=>{
    const blk=document.createElement('div');blk.className='saf-block';
    const row=document.createElement('div');row.className='saf-row';
    const lc=document.createElement('div');lc.className='saf-label-col';
    lc.innerHTML=`<span class="saf-num">${sn+1}.</span>`;
    row.appendChild(lc);
    const sc=document.createElement('div');sc.className='saf-slots';
    for(let i=0;i<cnt;i++){sc.appendChild(mkSlot(side,si,sn));si++;}
    row.appendChild(sc);blk.appendChild(row);
    const tip=document.createElement('div');tip.className='saf-tip';
    tip.textContent=SAF_TIPS[side][sn];blk.appendChild(tip);
    el.appendChild(blk);
  });
}

function mkSlot(side,idx,sn){
  const slot=document.createElement('div');
  slot.className=`slot ${side}-slot`;
  const u=ST[side].sl[idx];
  if(u){
    slot.classList.add('filled');
    slot.innerHTML=`<div class="slot-name" style="color:${TCOL[u.tier]||'#888'}">${u.name}</div><div class="slot-count">${fmt(u.count)}</div><div class="slot-stats"><span class="s-atk">⚔${u.atk}</span><span class="s-def">🛡${u.def}</span></div>`;
  }else{
    slot.innerHTML=`<div class="slot-empty">${sn+1}. SAF · ${idx%SAF[sn]+1}</div><div class="slot-hint">↕ sürükle veya seç+yerleştir</div>`;
  }
  if(ST[side].sel===idx)slot.classList.add('selected');
  slot.addEventListener('click',()=>selSlot(side,idx));
  if(u){slot.addEventListener('mouseenter',e=>showTT(e,u));slot.addEventListener('mouseleave',hideTT);slot.addEventListener('mousemove',movTT);}
  // drag source
  if(u){
    slot.draggable=true;
    slot.addEventListener('dragstart',e=>{dragD={t:'slot',side,idx};slot.classList.add('drag-src');e.dataTransfer.effectAllowed='move';});
    slot.addEventListener('dragend',()=>slot.classList.remove('drag-src'));
  }
  // drag target
  slot.addEventListener('dragover',e=>{e.preventDefault();slot.classList.add('drag-over');});
  slot.addEventListener('dragleave',()=>slot.classList.remove('drag-over'));
  slot.addEventListener('drop',e=>{e.preventDefault();slot.classList.remove('drag-over');doDrop(side,idx);});
  return slot;
}

function doDrop(tSide,tIdx){
  if(!dragD)return;
  if(dragD.t==='slot'){
    if(dragD.side!==tSide)return;
    const si=dragD.idx;
    const tmp=ST[tSide].sl[si];
    ST[tSide].sl[si]=ST[tSide].sl[tIdx];
    ST[tSide].sl[tIdx]=tmp;
    if(ST[tSide].sel===si)ST[tSide].sel=tIdx;
    else if(ST[tSide].sel===tIdx)ST[tSide].sel=si;
    buildF(tSide);updateOz(tSide);
  }else if(dragD.t==='picker'){
    if(dragD.side!==tSide)return;
    if(isUsed(tSide,dragD.un))return;
    const au=[...UNITS.dark,...UNITS.light];
    const u=au.find(x=>x.name===dragD.un);if(!u)return;
    const cnt=parseInt(document.getElementById(tSide+'Cnt').value)||1000;
    ST[tSide].sl[tIdx]={...u,count:cnt,dead:0};
    ST[tSide].sel=tIdx;
    buildF(tSide);buildList(tSide);updateOz(tSide);
  }
  dragD=null;
}

function selSlot(side,idx){
  ST[side].sel=idx;buildF(side);
  if(ST[side].sl[idx])document.getElementById(side+'Cnt').value=ST[side].sl[idx].count;
}

// ---- UNIT LIST ----
function isUsed(side,name){return ST[side].sl.some(s=>s&&s.name===name);}

function buildList(side){
  const te=document.getElementById(side+'Tabs');te.innerHTML='';
  Object.keys(TABS).forEach(tab=>{
    const b=document.createElement('button');
    b.className='picker-tab'+(ST[side].tab===tab?' active':'');
    b.textContent=tab.toUpperCase();
    b.onclick=()=>{ST[side].tab=tab;buildList(side);};
    te.appendChild(b);
  });
  const le=document.getElementById(side+'List');le.innerHTML='';
  UNITS[side].filter(u=>TABS[ST[side].tab].includes(u.tier)).forEach(unit=>{
    const used=isUsed(side,unit.name);
    const item=document.createElement('div');
    item.className='unit-item'+(ST[side].su===unit.name?' sel':'')+(used?' used':'');
    item.innerHTML=`<div style="display:flex;align-items:flex-start;gap:4px"><div class="tdot t-${unit.tier}"></div><div class="ui-name">${unit.name}</div></div><div class="ui-stats"><span class="s-atk">⚔${unit.atk}</span><span class="s-def">🛡${unit.def}</span></div>`;
    if(!used){
      item.draggable=true;
      item.addEventListener('dragstart',e=>{dragD={t:'picker',side,un:unit.name};e.dataTransfer.effectAllowed='copy';});
      item.addEventListener('click',()=>{ST[side].su=unit.name;buildList(side);});
    }
    item.addEventListener('mouseenter',e=>showTT(e,unit));
    item.addEventListener('mouseleave',hideTT);
    item.addEventListener('mousemove',movTT);
    le.appendChild(item);
  });
}

function placeUnit(side){
  if(ST[side].sel===null){alert('Önce formasyonda bir slot seçin!');return;}
  if(!ST[side].su){alert('Önce bir birim seçin!');return;}
  const cur=ST[side].sl[ST[side].sel];
  if(isUsed(side,ST[side].su)&&(!cur||cur.name!==ST[side].su)){
    alert('Bu birim zaten başka bir slotta kullanılıyor!\nHer birim türü sadece bir kez yerleştirilebilir.');return;
  }
  const cnt=parseInt(document.getElementById(side+'Cnt').value);
  if(!cnt||cnt<1){alert('Geçerli bir sayı girin!');return;}
  const au=[...UNITS.dark,...UNITS.light];
  const u=au.find(x=>x.name===ST[side].su);if(!u)return;
  ST[side].sl[ST[side].sel]={...u,count:cnt,dead:0};
  buildF(side);buildList(side);updateOz(side);
}

function clearSlot(side){
  if(ST[side].sel===null)return;
  ST[side].sl[ST[side].sel]=null;buildF(side);buildList(side);updateOz(side);
}

function clearAll(side){
  ST[side].sl=Array(SLOTS).fill(null);ST[side].sel=null;ST[side].su=null;
  buildF(side);buildList(side);updateOz(side);
}

function updateOz(side){
  const p=side==='dark'?'d':'l';
  const f=ST[side].sl.filter(Boolean);
  document.getElementById(p+'-b').textContent=fmt(f.reduce((s,u)=>s+u.count,0));
  document.getElementById(p+'-a').textContent=fmt(f.reduce((s,u)=>s+u.count*u.atk,0));
  document.getElementById(p+'-d').textContent=fmt(f.reduce((s,u)=>s+u.count*u.def,0));
}

// ---- TOOLTIP ----
function showTT(e,u){
  const t=document.getElementById('tt');

}
function movTT(e){const t=document.getElementById('tt');t.style.left=Math.min(e.clientX+14,window.innerWidth-t.offsetWidth-8)+'px';t.style.top=Math.min(e.clientY+14,window.innerHeight-t.offsetHeight-8)+'px';}
function hideTT(){document.getElementById('tt').style.display='none';}

// ---- SAVAŞ ----
function simulate(){
  const df=ST.dark.sl.filter(Boolean),lf=ST.light.sl.filter(Boolean);
  if(!df.length||!lf.length){alert('Her iki tarafın da en az 1 birimi olmalı!');return;}
  const dSnap=ST.dark.sl.map(s=>s?{...s}:null);
  const lSnap=ST.light.sl.map(s=>s?{...s}:null);
  let dA=ST.dark.sl.map(s=>s?{...s,dead:0}:null);
  let lA=ST.light.sl.map(s=>s?{...s,dead:0}:null);
  const log=[];
  for(let tur=1;tur<=6;tur++){
    const du=dA.filter(Boolean),lu=lA.filter(Boolean);
    if(!du.length||!lu.length)break;
    const dB=du.reduce((s,u)=>s+u.count,0),lB=lu.reduce((s,u)=>s+u.count,0);
    const dF=du.filter(u=>u.tier!=='priest'),lF=lu.filter(u=>u.tier!=='priest');
    const dFB=dF.reduce((s,u)=>s+u.count,0),lFB=lF.reduce((s,u)=>s+u.count,0);
    const dATK=du.reduce((s,u)=>s+u.count*u.atk,0),lATK=lu.reduce((s,u)=>s+u.count*u.atk,0);
    const dDEF=dF.reduce((s,u)=>s+u.count*u.def,0),lDEF=lF.reduce((s,u)=>s+u.count*u.def,0);
    const dO=lDEF>0?Math.min((dATK/lDEF)*.35,.95):.95;
    const lO=dDEF>0?Math.min((lATK/dDEF)*.35,.95):.95;
    const dV=Math.floor(lFB*dO),lV=Math.floor(dFB*lO);
    appLoss(lA,dV);appLoss(dA,lV);
    const dPC=dA.filter(u=>u&&u.tier==='priest').reduce((s,u)=>s+u.count,0);
    const lPC=lA.filter(u=>u&&u.tier==='priest').reduce((s,u)=>s+u.count,0);
    const dR=dPC>0?resur(dA,dPC*PRPU):0;
    const lR=lPC>0?resur(lA,lPC*PRPU):0;
    const dAf=dA.filter(Boolean).reduce((s,u)=>s+u.count,0);
    const lAf=lA.filter(Boolean).reduce((s,u)=>s+u.count,0);
    // Tur sonu birim listesi snapshot
    const dUS=dA.filter(Boolean).map(u=>({name:u.name,count:u.count,tier:u.tier}));
    const lUS=lA.filter(Boolean).map(u=>({name:u.name,count:u.count,tier:u.tier}));
    log.push({tur,dB,dAf,dK:lV,dR,dATK,dDEF,dUS,lB,lAf,lK:dV,lR,lATK,lDEF,lUS});
    if(!dAf||!lAf)break;
  }
  const dFin=dA.filter(Boolean).reduce((s,u)=>s+u.count,0);
  const lFin=lA.filter(Boolean).reduce((s,u)=>s+u.count,0);
  lastB={log,dSnap,lSnap,dFin,lFin};
  const qb=document.getElementById('qbanner');
  if(dFin>lFin){qb.className='qbanner r-dk';qb.textContent='🏆 KARANLIK ORDU GALİP GELDİ';}
  else if(lFin>dFin){qb.className='qbanner r-lt';qb.textContent='🏆 AYDINLIK ORDU GALİP GELDİ';}
  else{qb.className='qbanner r-dr';qb.textContent='⚔ BERABERE';}
  const qr=document.getElementById('qresult');qr.classList.add('show');
  qr.scrollIntoView({behavior:'smooth',block:'center'});
}

function appLoss(army,loss){
  let rem=loss;
  for(let i=0;i<army.length&&rem>0;i++){
    const u=army[i];if(!u||u.tier==='priest')continue;
    const t=Math.min(u.count,rem);u.count-=t;u.dead=(u.dead||0)+t;rem-=t;
    if(u.count<=0)army[i]=null;
  }
}
function resur(army,max){
  let rem=Math.floor(max),tot=0;
  for(let i=army.length-1;i>=0&&rem>0;i--){
    const u=army[i];if(!u||!u.dead||u.tier==='priest'||u.tier==='dragon')continue;
    const r=Math.min(u.dead,rem);u.count+=r;u.dead-=r;rem-=r;tot+=r;
  }
  return tot;
}

// ---- INIT ----
function init(){
  const au=[...UNITS.dark,...UNITS.light];
  const pl=(side,name,cnt,idx)=>{const u=au.find(x=>x.name===name);if(u)ST[side].sl[idx]={...u,count:cnt,dead:0};};
  pl('dark','İskelet',5000,0);pl('dark','Goblin',2000,1);pl('dark','Ogre Savaşçı',1000,2);
