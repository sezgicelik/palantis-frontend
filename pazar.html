<body>
<div id="hudbar-mount"></div>
<div class="layout">
  <div id="sidebar-mount"></div>
  <div class="main-content">

    <h2 style="color:#c8a96e;font-family:'Cinzel',serif;margin:0 0 8px;font-size:clamp(16px,4vw,22px)">🏪 Oyuncu Pazari</h2>
    <div id="pz-kervan-uyari" style="display:none;background:rgba(231,76,60,0.1);border:1px solid #e74c3c;border-radius:6px;padding:12px;margin-bottom:12px;text-align:center">
      <span style="color:#e74c3c;font-size:12px">Pazarda kervanin yok! Once <a href="kervan.html" style="color:#f1c40f">Kervan sayfasindan</a> bir kervan olustur ve pazara gonder.</span>
    </div>
    <p id="pz-aciklama" style="color:#666;font-size:11px;margin-bottom:16px">Kervanin pazarda olmali. Kaynak sat, baska oyunculardan satin al.</p>

    <!-- Pazardaki kervanlarim -->
    <div id="pz-kervan-ozet" class="card" style="padding:12px;margin-bottom:12px;display:none">
      <h3 style="color:#c8a96e;font-size:12px;margin:0 0 8px">🐪 Pazardaki Kervanlarim</h3>
      <div id="pz-kervan-ozet-icerik"></div>
    </div>

    <!-- Sekmeler -->
    <div class="army-tabs" style="margin-bottom:16px">
      <button class="atab on" onclick="pazarTab('ilanlar',this)">Tum Ilanlar</button>
      <button class="atab" onclick="pazarTab('sat',this)">Ilan Ver</button>
      <button class="atab" onclick="pazarTab('benim',this)">Ilanlarim</button>
      <button class="atab" onclick="pazarTab('kadim',this)" style="background:rgba(212,175,55,0.1);border:1px solid rgba(212,175,55,0.3)">🏛 Kadim Sehirler</button>
    </div>

    <!-- TUM ILANLAR -->
    <div id="ptab-ilanlar">
      <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center">
        <label style="font-size:10px;color:#888">Ne ariyorsun:</label>
        <select id="pz-filtre" onchange="loadIlanlar()" style="padding:4px;background:#1a1a1a;border:1px solid #333;color:#ddd;border-radius:4px;font-size:11px">
          <option value="">Tum Hammaddeler</option>
        </select>
        <button class="btn-action" onclick="loadIlanlar()" style="padding:4px 10px;font-size:10px;width:auto">Ara</button>
      </div>
      <div id="pz-ilanlar-liste"></div>
    </div>

    <!-- ILAN VER -->
    <div id="ptab-sat" style="display:none">
      <div class="card" style="padding:14px">
        <h3 style="color:#c8a96e;font-size:13px;margin-bottom:10px">Yeni Ilan</h3>
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px">
          <label style="font-size:11px;color:#888">Kervan:</label>
          <select id="pz-kervan" style="padding:4px;background:#1a1a1a;border:1px solid #333;color:#ddd;border-radius:4px;font-size:11px;min-width:150px">
            <option value="">-- Kervan sec --</option>
          </select>
        </div>
        <div id="pz-kervan-yuk" style="margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px"></div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px">
          <label style="font-size:11px;color:#888">Satiyorum:</label>
          <input id="pz-sat-miktar" type="number" value="100" min="1" style="padding:4px;width:70px;background:#1a1a1a;border:1px solid #333;color:#ddd;border-radius:4px;font-size:11px">
          <select id="pz-sat-kaynak" style="padding:4px;background:#1a1a1a;border:1px solid #333;color:#ddd;border-radius:4px;font-size:11px">
            <option value="odun">Odun</option><option value="metal">Metal</option>
            <option value="kereste">Kereste</option><option value="islenmis">İşlenmiş</option>
            <option value="bugday">Buğday</option><option value="balik">Balık</option><option value="cig_et">Çiğ Et</option>
            <option value="ekmek">Ekmek</option><option value="pismis">Pişmiş</option><option value="pismis_et">Pişmiş Et</option>
          </select>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px">
          <label style="font-size:11px;color:#888">Karsiliginda:</label>
          <input id="pz-istek-miktar" type="number" value="500" min="1" style="padding:4px;width:70px;background:#1a1a1a;border:1px solid #333;color:#ddd;border-radius:4px;font-size:11px">
          <select id="pz-istek-kaynak" style="padding:4px;background:#1a1a1a;border:1px solid #333;color:#ddd;border-radius:4px;font-size:11px">
            <option value="altin">Altın</option><option value="odun">Odun</option>
            <option value="metal">Metal</option><option value="kereste">Kereste</option><option value="islenmis">İşlenmiş</option>
            <option value="bugday">Buğday</option><option value="balik">Balık</option><option value="ekmek">Ekmek</option>
            <option value="pismis">Pişmiş</option><option value="pismis_et">Pişmiş Et</option><option value="cig_et">Çiğ Et</option>
            <option value="mana_beyaz">Beyaz Mana</option><option value="mana_kirmizi">Kirmizi Mana</option>
            <option value="mana_mavi">Mavi Mana</option><option value="mana_yesil">Yesil Mana</option>
            <option value="at">At</option><option value="kurt">Kurt</option>
            <option value="ates_tozu">Kristal Tozu</option><option value="ay_cigi">Ay Tasi</option>
            <option value="golgeler_otu">Karanlik Esans</option><option value="ejderha_goz_damla">Ejderha Pulu</option>
          </select>
        </div>
        <!-- v1.13.1: Piyasa ipucu + sinir uyarisi -->
        <div id="pz-piyasa-bilgi" style="font-size:11px;margin:4px 0 8px 0;padding:6px 10px;background:rgba(200,169,110,0.08);border-left:2px solid #c8a96e;border-radius:4px;color:#ccc"></div>
        <button class="btn-action" id="pz-ilan-btn" onclick="pzIlanVer()" style="padding:6px 16px;font-size:12px;width:auto">Ilan Ver</button>
        <div id="pz-ilan-msg" style="font-size:11px;margin-top:6px;min-height:14px"></div>
      </div>
    </div>

    <!-- ILANLARIM -->
    <div id="ptab-benim" style="display:none">
      <div id="pz-benim-liste"></div>
    </div>

    <!-- KADIM SEHIRLER -->
    <div id="ptab-kadim" style="display:none">
      <div id="kadim-sehir-secim" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px"></div>
      <div id="kadim-uyari" style="display:none;background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.3);border-radius:6px;padding:10px;margin-bottom:12px;font-size:11px;color:#e74c3c;text-align:center"></div>
      <div id="kadim-mallar"></div>
    </div>

  </div>
</div>

<script>
const TARAF_RENK = { iyi:'#f1c40f', kotu:'#3498db' };

function pazarTab(tab, el) {
  document.getElementById('ptab-ilanlar').style.display = tab==='ilanlar' ? 'block' : 'none';
  document.getElementById('ptab-sat').style.display = tab==='sat' ? 'block' : 'none';
  document.getElementById('ptab-benim').style.display = tab==='benim' ? 'block' : 'none';
  document.getElementById('ptab-kadim').style.display = tab==='kadim' ? 'block' : 'none';
  document.querySelectorAll('.army-tabs .atab').forEach(b => b.classList.remove('on'));
  if (el) el.classList.add('on');
  if (tab === 'ilanlar') loadIlanlar();
  if (tab === 'sat') loadKervanlarPazar();
  if (tab === 'benim') loadBenimIlanlar();
  if (tab === 'kadim') loadKadimSehirler();
}

// ═══════ KADIM SEHIRLER ═══════
const KADIM_IKON = {odun:'🌳',metal:'⛏️',bugday:'🌾',balik:'🐟',kereste:'🪵',islenmis:'🔩',cig_et:'🥩',ekmek:'🍞',pismis:'🐟',pismis_et:'🥩'};
let _kadimSecili = null;

async function loadKadimSehirler() {
  const token = getToken(); if (!token) return;
  try {
    const resp = await fetch(API_BASE + '/api/kadim-sehir', { headers: { 'Authorization': 'Bearer ' + token } });
    const data = await resp.json();
    if (!data.ok) { toast(data.error || 'Hata'); return; }

    const el = document.getElementById('kadim-sehir-secim');
    el.innerHTML = data.sehirler.map(s => {
      const renk = s.taraf === 'isik' ? '#f1c40f' : '#3498db';
      const ikon = s.taraf === 'isik' ? '🌟' : '💀';
      return `<div class="card" style="padding:14px;cursor:pointer;border:2px solid ${_kadimSecili===s.id ? renk : 'transparent'};text-align:center;transition:border 0.2s" onclick="kadimSec(${s.id})">
        <div style="font-size:20px;margin-bottom:4px">${ikon}</div>
        <div style="color:${renk};font-weight:bold;font-size:14px;font-family:'Cinzel',serif">${s.isim}</div>
        <div style="font-size:10px;color:#888;margin-top:4px">${s.taraf === 'isik' ? 'Isik Sehri' : 'Karanlik Sehir'}</div>
        <div style="font-size:10px;color:#555;margin-top:6px">Konum: ${s.x}:${s.y} | Ordu: ${s.ordu_gucu}</div>
        <div style="font-size:10px;color:#d4af37;margin-top:4px">Ticaretiniz: ${s.toplam_ticaret.toLocaleString()} altin</div>
      </div>`;
    }).join('');

    if (!_kadimSecili && data.sehirler.length > 0) return;
    if (_kadimSecili) loadKadimPazar(_kadimSecili);
  } catch(e) { toast('Sunucu hatasi'); }
}

function kadimSec(sehirId) {
  _kadimSecili = sehirId;
  loadKadimSehirler();
  loadKadimPazar(sehirId);
}

async function loadKadimPazar(sehirId) {
  const token = getToken(); if (!token) return;
  try {
    const resp = await fetch(API_BASE + '/api/kadim-sehir/' + sehirId + '/pazar', { headers: { 'Authorization': 'Bearer ' + token } });
    const data = await resp.json();
    if (!data.ok) { toast(data.error || 'Hata'); return; }

    // Uyari
    const uyariEl = document.getElementById('kadim-uyari');
    if (data.uyari) { uyariEl.style.display = 'block'; uyariEl.textContent = '⚠️ ' + data.uyari; }
    else { uyariEl.style.display = 'none'; }

    // v1.14.1.09 — Indirim ozeti (üst bar)
    const ind = data.indirim || {};
    let indirimBar = '';
    const indirimBadges = [];
    if (ind.holding) indirimBadges.push('<span style="background:#d4af37;color:#000;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:bold">🏰 Holding Guild %25</span>');
    if (ind.gunluk_ilk) indirimBadges.push('<span style="background:#2ecc71;color:#000;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:bold">📅 Gunluk Ilk %10</span>');
    indirimBadges.push('<span style="background:#3498db;color:#fff;padding:2px 8px;border-radius:3px;font-size:10px" title="5.000+ birim alımda %5, 10.000+ birim alımda %10">📦 Toplu Alim %5-10</span>');
    if (indirimBadges.length > 0) {
      indirimBar = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;padding:8px;background:rgba(212,175,55,0.08);border:1px solid rgba(212,175,55,0.3);border-radius:4px">' +
        '<span style="font-size:11px;color:#888;margin-right:4px">Aktif Indirimler:</span>' + indirimBadges.join('') + '</div>';
    }

    // Mallar
    const el = document.getElementById('kadim-mallar');
    const renk = data.sehir.taraf === 'isik' ? '#f1c40f' : '#3498db';
    el.innerHTML = '<h3 style="color:' + renk + ';font-size:13px;margin:0 0 10px;font-family:Cinzel,serif">' + data.sehir.isim + ' Pazari</h3>' +
      indirimBar +
      data.mallar.filter(m => m.satista).map(m => {
        const indirimBadge = (m.indirim_yuzde > 0)
          ? `<span style="background:#e74c3c;color:#fff;padding:1px 6px;border-radius:2px;font-size:9px;font-weight:bold;margin-left:4px">-%${m.indirim_yuzde}</span>`
          : '';
        const normalFiyat = (m.fiyat_normal > m.fiyat)
          ? `<span style="color:#888;text-decoration:line-through;font-size:10px">${m.fiyat_normal}</span> `
          : '';
        return `<div class="card" style="padding:8px;margin-bottom:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div style="min-width:110px">
            <span style="font-size:14px">${KADIM_IKON[m.kaynak]||''}</span>
            <span style="color:#ddd;font-weight:bold;font-size:12px">${m.isim}</span>
          </div>
          <div style="flex:1;font-size:10px;color:#888">
            Stok: <span style="color:#2ecc71">${m.stok.toLocaleString()}</span> |
            Fiyat: ${normalFiyat}<span style="color:#d4af37;font-weight:bold">${m.fiyat} altin/adet</span>${indirimBadge}
          </div>
          <div style="display:flex;gap:4px;align-items:center">
            <input type="number" id="kadim-miktar-${m.kaynak}" value="100" min="1" max="10000" style="width:65px;padding:4px;background:#1a1a1a;border:1px solid #333;color:#ddd;border-radius:3px;font-size:11px">
            <button class="btn-action" onclick="kadimSatinAl(${sehirId},'${m.kaynak}',${m.fiyat})" style="padding:4px 10px;font-size:10px;width:auto">Satin Al</button>
          </div>
        </div>`;
      }).join('') || '<div style="text-align:center;color:#555;padding:20px">Stok bos</div>';
  } catch(e) { toast('Sunucu hatasi'); }
}

async function kadimSatinAl(sehirId, kaynak, birimFiyat) {
  const token = getToken(); if (!token) return;
  const miktarEl = document.getElementById('kadim-miktar-' + kaynak);
  const miktar = parseInt(miktarEl?.value) || 0;
  if (miktar <= 0) { toast('Gecerli miktar gir'); return; }

  const toplam = miktar * birimFiyat;
  if (!confirm(miktar + ' adet ' + kaynak + ' satin al?\nToplam: ' + toplam.toLocaleString() + ' altin')) return;

  try {
    const resp = await fetch(API_BASE + '/api/kadim-sehir/' + sehirId + '/satin-al', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ kaynak, miktar })
    });
    const data = await resp.json();
    if (!resp.ok) { toast(data.error || 'Hata'); return; }
    toast(data.mesaj);
    loadKadimPazar(sehirId);
    loadKadimSehirler();
    if (typeof loadGameData === 'function') loadGameData();
  } catch(e) { toast('Sunucu hatasi'); }
}

async function loadIlanlar() {
  const token = getToken(); if (!token) return;
  const filtre = document.getElementById('pz-filtre').value;
  let url = API_BASE + '/api/pazar/ilanlar';
  if (filtre) url += '?kaynak=' + filtre;
  try {
    const resp = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
    const data = await resp.json();
    if (!data.ok) return;

    const el = document.getElementById('pz-ilanlar-liste');
    if (data.ilanlar.length === 0) {
      el.innerHTML = '<div style="text-align:center;color:#555;padding:30px">Aktif ilan yok</div>';
      return;
    }

    el.innerHTML = data.ilanlar.map(i => `
      <div class="card" style="padding:10px;margin-bottom:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div style="min-width:100px">
          <div style="color:${TARAF_RENK[i.satici_taraf]||'#888'};font-weight:bold;font-size:12px">${i.satici_kral}</div>
        </div>
        <div style="flex:1;min-width:200px">
          <span style="color:#2ecc71;font-weight:bold">${i.satis_miktar.toLocaleString()} ${i.satis_kaynak}</span>
          <span style="color:#555;margin:0 6px">→</span>
          <span style="color:#f1c40f;font-weight:bold">${i.istek_miktar.toLocaleString()} ${i.istek_kaynak}</span>
        </div>
        ${i.benim_mi
          ? '<span style="color:#555;font-size:10px">Senin ilanin</span>'
          : `<button class="btn-action" onclick="pzSatinAl(${i.id})" style="padding:4px 12px;font-size:10px;width:auto">Satin Al</button>`
        }
      </div>
    `).join('');
  } catch(e) { console.error(e); }
}

let PZ_KERVANLAR = [];

async function loadKervanlarPazar() {
  const token = getToken(); if (!token) return;
  try {
    const resp = await fetch(API_BASE + '/api/kervan/liste', { headers: { 'Authorization': 'Bearer ' + token } });
    const data = await resp.json();
    PZ_KERVANLAR = (data.kervanlar || []).filter(k => k.durum === 'pazarda');
    const sel = document.getElementById('pz-kervan');
    sel.innerHTML = '<option value="">-- Kervan sec --</option>' +
      PZ_KERVANLAR.map(k => `<option value="${k.id}">${k.isim} (${k.toplam_yuk.toLocaleString()}/${k.kapasite.toLocaleString()})</option>`).join('');
    if (PZ_KERVANLAR.length === 0) {
      document.getElementById('pz-ilan-msg').innerHTML = '<span style="color:#e74c3c">Pazarda kervan yok! Once kervan sayfasindan bir kervan gonderin.</span>';
    }
    // Kervan secildiginde yukunu goster
    sel.onchange = function() {
      const kid = parseInt(this.value);
      const yukEl = document.getElementById('pz-kervan-yuk');
      if (!yukEl) return;
      const k = PZ_KERVANLAR.find(x => x.id === kid);
      if (!k || !k.yuk || Object.keys(k.yuk).length === 0) {
        yukEl.innerHTML = '<span style="color:#555;font-size:11px">Kervanda yuk yok</span>';
        return;
      }
      yukEl.innerHTML = Object.entries(k.yuk).filter(([,v])=>v>0).map(([key,val]) =>
        `<span style="background:#1a1a1a;padding:3px 8px;border-radius:4px;font-size:11px;color:#bbb;border:1px solid #333">${key}: ${val.toLocaleString()}</span>`
      ).join(' ');
    };
  } catch(e) {}
}

async function pzIlanVer() {
  const token = getToken(); if (!token) return;
  const kervan_id = parseInt(document.getElementById('pz-kervan').value);
  if (!kervan_id) { document.getElementById('pz-ilan-msg').innerHTML = '<span style="color:#e74c3c">Kervan secin</span>'; return; }
  const body = {
    kervan_id,
    satis_kaynak: document.getElementById('pz-sat-kaynak').value,
    satis_miktar: parseInt(document.getElementById('pz-sat-miktar').value) || 0,
    istek_kaynak: document.getElementById('pz-istek-kaynak').value,
    istek_miktar: parseInt(document.getElementById('pz-istek-miktar').value) || 0,
  };
  const resp = await fetch(API_BASE+'/api/pazar/ilan-ver',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)}).then(r=>r.json());
  document.getElementById('pz-ilan-msg').innerHTML = resp.ok ? `<span style="color:#2ecc71">${resp.mesaj}</span>` : `<span style="color:#e74c3c">${resp.error||'Hata'}</span>`;
  if (resp.ok) { loadKervanlarPazar(); loadIlanlar(); }
}

// v1.13.1: Piyasa deger cache + ipucu UI
var PZ_KAYNAK_DEGERLERI = {}; // kaynak -> mevcut_altin_deger
var PZ_SINIRLAR = { min_yuzde: 50, max_yuzde: 200 };

async function pzKaynakDegerleriYukle() {
  const token = getToken(); if (!token) return;
  try {
    const r = await fetch(API_BASE + '/api/pazar/kaynak-degerleri', { headers: { 'Authorization': 'Bearer ' + token } });
    const d = await r.json();
    if (d.kaynaklar) {
      PZ_KAYNAK_DEGERLERI = {};
      d.kaynaklar.forEach(k => { PZ_KAYNAK_DEGERLERI[k.kaynak] = parseFloat(k.mevcut_altin_deger) || 0; });
      PZ_SINIRLAR = d.sinirlar || PZ_SINIRLAR;
    }
  } catch(e) {}
}

function pzPiyasaGuncelle() {
  const satKaynak = document.getElementById('pz-sat-kaynak')?.value;
  const istekKaynak = document.getElementById('pz-istek-kaynak')?.value;
  const satMiktar = parseFloat(document.getElementById('pz-sat-miktar')?.value) || 0;
  const istekMiktar = parseFloat(document.getElementById('pz-istek-miktar')?.value) || 0;
  const bilgiEl = document.getElementById('pz-piyasa-bilgi');
  const btnEl = document.getElementById('pz-ilan-btn');
  if (!bilgiEl) return;

  const satDeger = PZ_KAYNAK_DEGERLERI[satKaynak] || 0;
  const istekDeger = PZ_KAYNAK_DEGERLERI[istekKaynak] || 0;
  if (satDeger <= 0 || istekDeger <= 0) {
    bilgiEl.innerHTML = '<span style="color:#999">Piyasa degeri yukleniyor...</span>';
    if (btnEl) btnEl.disabled = false;
    return;
  }

  // Hedef oran: 1 sat_kaynak = X istek_kaynak
  const hedefOran = satDeger / istekDeger;
  const altSinir = hedefOran * PZ_SINIRLAR.min_yuzde / 100;
  const ustSinir = hedefOran * PZ_SINIRLAR.max_yuzde / 100;

  let uyari = '';
  let uyariRenk = '#c8a96e';
  let disable = false;
  if (satMiktar > 0 && istekMiktar > 0) {
    const gercekOran = istekMiktar / satMiktar;
    const yuzdeFark = ((gercekOran - hedefOran) / hedefOran * 100).toFixed(0);
    if (gercekOran < altSinir) {
      uyari = ` ⚠️ Cok dusuk! Min: ${altSinir.toFixed(2)} ${istekKaynak}/${satKaynak} (piyasa %${PZ_SINIRLAR.min_yuzde})`;
      uyariRenk = '#e74c3c';
      disable = true;
    } else if (gercekOran > ustSinir) {
      uyari = ` ⚠️ Cok yuksek! Max: ${ustSinir.toFixed(2)} ${istekKaynak}/${satKaynak} (piyasa %${PZ_SINIRLAR.max_yuzde})`;
      uyariRenk = '#e74c3c';
      disable = true;
    } else {
      uyari = ` ✓ Piyasa ile uyumlu (${yuzdeFark >= 0 ? '+' : ''}${yuzdeFark}%)`;
      uyariRenk = '#2ecc71';
    }
  }

  bilgiEl.style.borderLeftColor = uyariRenk;
  bilgiEl.innerHTML =
    `<div style="color:#aaa">💹 Piyasa: <b style="color:${uyariRenk}">1 ${satKaynak}</b> ≈ <b>${hedefOran.toFixed(2)} ${istekKaynak}</b></div>` +
    `<div style="font-size:10px;color:#888">Izinli aralik: ${altSinir.toFixed(2)} — ${ustSinir.toFixed(2)} ${istekKaynak}/${satKaynak}</div>` +
    (uyari ? `<div style="font-size:11px;color:${uyariRenk};margin-top:3px">${uyari}</div>` : '');
  if (btnEl) btnEl.disabled = disable;
}

// Listener bagla (form input degisimleri)
document.addEventListener('DOMContentLoaded', () => {
  ['pz-sat-kaynak','pz-sat-miktar','pz-istek-kaynak','pz-istek-miktar'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.addEventListener('change', pzPiyasaGuncelle); el.addEventListener('input', pzPiyasaGuncelle); }
  });
  pzKaynakDegerleriYukle().then(pzPiyasaGuncelle);
});

async function pzSatinAl(ilanId) {
  const token = getToken(); if (!token) return;
  // Pazardaki kervanimi bul
  if (PZ_KERVANLAR.length === 0) await loadKervanlarPazar();
  if (PZ_KERVANLAR.length === 0) { showToast('Pazarda kervanin yok!','error'); return; }
  const kervanId = PZ_KERVANLAR[0].id; // ilk pazardaki kervani kullan
  if (!confirm('Bu ilani satin almak istiyor musunuz?')) return;

  const resp = await fetch(API_BASE+'/api/pazar/satin-al',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({ilan_id:ilanId,kervan_id:kervanId})}).then(r=>r.json());
  if (resp.ok) { showToast(resp.mesaj,'success'); loadIlanlar(); }
  else showToast(resp.error||'Hata','error');
}

async function loadBenimIlanlar() {
  const token = getToken(); if (!token) return;
  try {
    const resp = await fetch(API_BASE+'/api/pazar/benim',{headers:{'Authorization':'Bearer '+token}});
    const data = await resp.json();
    const el = document.getElementById('pz-benim-liste');
    if (!data.ok || data.ilanlar.length === 0) { el.innerHTML = '<div style="text-align:center;color:#555;padding:30px">Henuz ilan vermediniz</div>'; return; }

    el.innerHTML = data.ilanlar.map(i => {
      const durumRenk = i.durum==='aktif'?'#2ecc71':i.durum==='satildi'?'#3498db':'#e74c3c';
      return `<div class="card" style="padding:10px;margin-bottom:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div style="min-width:180px">
          <span style="color:#2ecc71">${i.satis_miktar} ${i.satis_kaynak}</span>
          <span style="color:#555"> → </span>
          <span style="color:#f1c40f">${i.istek_miktar} ${i.istek_kaynak}</span>
        </div>
        <span style="color:${durumRenk};font-size:11px;font-weight:bold">${i.durum.toUpperCase()}</span>
        ${i.alici_kral ? `<span style="color:#888;font-size:10px">Alici: ${i.alici_kral}</span>` : ''}
        ${i.durum==='aktif' ? `<button class="btn-action" onclick="pzIptal(${i.id})" style="padding:3px 10px;font-size:10px;width:auto;border-color:#e74c3c;color:#e74c3c">Iptal</button>` : ''}
      </div>`;
    }).join('');
  } catch(e) {}
}

async function pzIptal(ilanId) {
  if (!confirm('Ilan iptal edilecek, kaynak kervana donecek. Emin misiniz?')) return;
  const token = getToken();
  const resp = await fetch(API_BASE+'/api/pazar/iptal',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({ilan_id:ilanId})}).then(r=>r.json());
  if (resp.ok) { showToast(resp.mesaj,'success'); loadBenimIlanlar(); }
  else showToast(resp.error||'Hata','error');
}

function renderKervanOzet() {
  const ozet = document.getElementById('pz-kervan-ozet');
  const icerik = document.getElementById('pz-kervan-ozet-icerik');
  if (!ozet || !icerik) return;
  if (PZ_KERVANLAR.length === 0) { ozet.style.display = 'none'; return; }
  ozet.style.display = 'block';
  icerik.innerHTML = PZ_KERVANLAR.map(k => {
    const yukParts = Object.entries(k.yuk || {}).filter(([,v])=>v>0).map(([key,val]) =>
      `<span style="background:#1a1a1a;padding:2px 6px;border-radius:3px;font-size:10px;color:#bbb;border:1px solid #222">${key}: ${val.toLocaleString()}</span>`
    ).join(' ') || '<span style="color:#555;font-size:10px">Bos</span>';
    return `<div style="margin-bottom:6px;padding:8px;background:#0d0d0d;border-radius:4px;border-left:2px solid #c8a96e">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="color:#d4af37;font-weight:bold;font-size:12px">${k.isim}</span>
        <span style="font-size:10px;color:#888">${k.toplam_yuk.toLocaleString()} / ${k.kapasite.toLocaleString()}</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:3px">${yukParts}</div>
    </div>`;
  }).join('');
}

async function loadSatilabilirFiltre() {
  try {
    const resp = await fetch(API_BASE + '/api/game/market', { headers: { 'Authorization': 'Bearer ' + getToken() } });
    if (!resp.ok) return;
    const data = await resp.json();
    // Sadece marketteki hammaddeler + temel kaynaklar
    const temel = ['odun','metal','altin','bugday','balik','kereste','islenmis','ekmek','pismis','pismis_et'];
    const sel = document.getElementById('pz-filtre');
    if (!sel) return;
    sel.innerHTML = '<option value="">Tum Hammaddeler</option>' +
      temel.map(k => `<option value="${k}">${k}</option>`).join('');
  } catch(e) {}
}

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(async ()=>{
    await loadSatilabilirFiltre();
    await loadKervanlarPazar();
    renderKervanOzet();
    const uyari = document.getElementById('pz-kervan-uyari');
    if (PZ_KERVANLAR.length === 0 && uyari) uyari.style.display = 'block';
    else if (uyari) uyari.style.display = 'none';
    loadIlanlar();
  }, 1500);
});
