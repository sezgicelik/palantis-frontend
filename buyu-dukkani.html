<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palantis – Buyu Dukkani</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="hudbar-mount"></div>
<div class="layout">
  <div id="sidebar-mount"></div>
  <div class="main-content">

    <h2 style="color:#9b59b6;font-family:'Cinzel',serif;margin:0 0 8px;font-size:clamp(16px,4vw,22px)">🔮 Buyu Dukkani</h2>
    <!-- Kervan yok uyarisi -->
    <div id="bd-engel" style="display:none;text-align:center;padding:40px">
      <div style="font-size:40px;margin-bottom:12px">🔮</div>
      <div style="color:#e74c3c;font-size:14px;font-weight:bold;margin-bottom:8px">Buyu dukkaninda kervanin yok!</div>
      <div style="color:#888;font-size:12px;margin-bottom:16px">Once <a href="kervan.html" style="color:#9b59b6">Kervan sayfasindan</a> bir kervan olusturup "Buyu Dukkanina Gonder" butonuna bas.</div>
      <a href="kervan.html" class="btn-action" style="padding:8px 20px;font-size:12px;width:auto;text-decoration:none;display:inline-block">Kervan Sayfasina Git</a>
    </div>

    <!-- Dukkan icerigi (kervan varsa gorunur) -->
    <div id="bd-icerik" style="display:none">

    <p style="color:#666;font-size:11px;margin-bottom:16px">Stoklar her 2 saatte yenilenir. Kervanindaki altinla satin al.</p>

    <!-- Kervan secimi -->
    <div class="card" style="padding:14px;margin-bottom:16px">
      <h3 style="color:#9b59b6;font-size:13px;margin-bottom:8px">Kervan Sec</h3>
      <select id="bd-kervan" onchange="bdKervanSec()" style="padding:6px;background:#1a1a1a;border:1px solid #333;color:#ddd;border-radius:4px;font-size:12px;min-width:200px">
        <option value="">-- Kervan sec --</option>
      </select>
      <div id="bd-kervan-info" style="font-size:10px;color:#888;margin-top:4px"></div>
    </div>

    <!-- Buyu Malzemeleri (uste) -->
    <div class="card" style="padding:14px;margin-bottom:16px">
      <h3 style="color:#9b59b6;font-size:13px;margin-bottom:10px">Buyu Malzemeleri</h3>
      <div id="bd-malzeme-liste"></div>
    </div>

    <!-- Mana Tupleri (renk bazli satirlar) -->
    <div class="card" style="padding:14px;margin-bottom:16px">
      <h3 style="color:#9b59b6;font-size:13px;margin-bottom:10px">Mana Tupleri</h3>
      <div id="bd-mana-liste"></div>
    </div>

    <div id="bd-msg" style="font-size:12px;text-align:center;min-height:16px;margin-top:8px"></div>

    </div><!-- /bd-icerik -->

  </div>
</div>
<div id="toast"></div>
<div id="building-modal-mount"></div>

<script src="js/constants.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/toast.js"></script>
<script src="js/theme.js"></script>
<script src="js/game-data.js"></script>
<script src="js/hud.js"></script>
<script src="js/layout.js"></script>
<script>
const RENK_ISIM = { beyaz:'Beyaz', kirmizi:'Kirmizi', mavi:'Mavi', yesil:'Yesil' };
const RENK_CSS = { beyaz:'#f5f5f5', kirmizi:'#e74c3c', mavi:'#3498db', yesil:'#2ecc71' };
const BOYUT_ISIM = { kucuk:'Kucuk', orta:'Orta', buyuk:'Buyuk' };
const MANA_RENKLERI = ['beyaz','kirmizi','mavi','yesil'];
let BD_STOK = null;
let BD_KERVAN_ID = null;

async function loadBuyuDukkani() {
  const token = getToken(); if (!token) return;

  // Kervan listesi — dukkaninda olan var mi?
  let buyuKervanlar = [];
  try {
    const kResp = await fetch(API_BASE + '/api/kervan/liste', { headers: { 'Authorization': 'Bearer ' + token } });
    if (kResp.ok) {
      const kData = await kResp.json();
      buyuKervanlar = kData.kervanlar.filter(k => k.durum === 'buyu_dukkaninda');
    }
  } catch(e) {}

  // Kervan yoksa engel goster, varsa icerik goster
  if (buyuKervanlar.length === 0) {
    document.getElementById('bd-engel').style.display = 'block';
    document.getElementById('bd-icerik').style.display = 'none';
    return;
  }
  document.getElementById('bd-engel').style.display = 'none';
  document.getElementById('bd-icerik').style.display = 'block';

  const sel = document.getElementById('bd-kervan');
  sel.innerHTML = '<option value="">-- Kervan sec --</option>' +
    buyuKervanlar.map(k => `<option value="${k.id}">${k.isim} (${k.toplam_yuk.toLocaleString()}/${k.kapasite.toLocaleString()})</option>`).join('');

  // Stok
  try {
    const resp = await fetch(API_BASE + '/api/buyu-dukkani/stok', { headers: { 'Authorization': 'Bearer ' + token } });
    if (resp.ok) {
      BD_STOK = await resp.json();
      renderBuyuDukkani();
    }
  } catch(e) {}
}

function bdKervanSec() {
  BD_KERVAN_ID = parseInt(document.getElementById('bd-kervan').value) || null;
  const info = document.getElementById('bd-kervan-info');
  if (BD_KERVAN_ID) {
    info.innerHTML = '<span style="color:#2ecc71">Kervan secildi — satin alma aktif</span>';
  } else {
    info.innerHTML = '';
  }
  // Butonlari guncelle (disabled/enabled)
  renderBuyuDukkani();
}

function renderBuyuDukkani() {
  if (!BD_STOK) return;

  // Buyu malzemeleri (uste)
  const malEl = document.getElementById('bd-malzeme-liste');
  const MAL_IKON = { ates_tozu:'🔥', ay_cigi:'🌙', golgeler_otu:'🌿', ejderha_goz_damla:'🐉' };
  malEl.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px">' +
    BD_STOK.malzemeler.map(m => `
      <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#111;border:1px solid #222;border-radius:4px">
        <span style="font-size:18px">${MAL_IKON[m.id]||'📦'}</span>
        <div style="flex:1">
          <div style="font-size:11px;font-weight:bold;color:#d4af37">${m.isim}</div>
          <div style="font-size:9px;color:#888">${m.fiyat.toLocaleString()} altin | Stok: <span style="color:${m.stok>0?'#2ecc71':'#e74c3c'}">${m.stok}/${m.max_stok}</span></div>
        </div>
        <input type="number" id="bd-mal-${m.id}" value="1" min="1" max="${m.stok}" style="padding:2px;width:35px;background:#1a1a1a;border:1px solid #333;color:#ddd;border-radius:3px;font-size:10px;text-align:center">
        <button class="btn-action" onclick="bdSatinAl('${m.id}',parseInt(document.getElementById('bd-mal-${m.id}').value)||1)" ${m.stok<1||!BD_KERVAN_ID?'disabled':''}
          style="padding:2px 8px;font-size:9px;width:auto;${!BD_KERVAN_ID?'opacity:0.3':''}">Al</button>
      </div>
    `).join('') + '</div>';

  // Mana tupleri — renk bazli satirlar, her satirda K-O-B yan yana
  const manaEl = document.getElementById('bd-mana-liste');
  let manaHTML = '';

  for (const renk of MANA_RENKLERI) {
    const renkCSS = RENK_CSS[renk] || '#888';
    const renkIsim = RENK_ISIM[renk] || renk;
    // Bu rengin 3 boyutunu bul
    const boyutlar = BD_STOK.manalar.filter(m => m.renk === renk);

    manaHTML += `<div style="margin-bottom:10px">
      <div style="color:${renkCSS};font-size:12px;font-weight:bold;margin-bottom:4px;border-bottom:1px solid ${renkCSS}33;padding-bottom:3px">${renkIsim} Mana</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">`;

    for (const m of boyutlar) {
      manaHTML += `<div style="background:#111;border:1px solid #222;border-radius:6px;padding:8px;border-top:2px solid ${renkCSS};text-align:center">
        <div style="font-size:11px;font-weight:bold;color:${renkCSS}">${BOYUT_ISIM[m.boyut]}</div>
        <div style="font-size:16px;margin:4px 0">+${m.mana_miktari}</div>
        <div style="font-size:9px;color:#888">${m.fiyat.toLocaleString()} altin</div>
        <div style="font-size:9px;color:${m.stok>0?'#2ecc71':'#e74c3c'};margin:2px 0">Stok: ${m.stok}/${m.max_stok}</div>
        <button class="btn-action" onclick="bdSatinAl('${m.id}',1)" ${m.stok<1||!BD_KERVAN_ID?'disabled':''}
          style="padding:2px 10px;font-size:9px;width:auto;${!BD_KERVAN_ID?'opacity:0.3':''}">Al</button>
      </div>`;
    }

    manaHTML += `</div></div>`;
  }

  manaEl.innerHTML = manaHTML;

}

async function bdSatinAl(urunId, miktar) {
  if (!BD_KERVAN_ID) { showToast('Once kervan secin!','error'); return; }
  const token = getToken(); if (!token) return;
  const r = await fetch(API_BASE+'/api/buyu-dukkani/satin-al',{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body:JSON.stringify({kervan_id:BD_KERVAN_ID, urun_id:urunId, miktar})}).then(r=>r.json());
  const el = document.getElementById('bd-msg');
  if (r.ok) {
    el.innerHTML = `<div style="padding:10px;background:rgba(46,204,113,0.15);border:1px solid #2ecc71;border-radius:6px;color:#2ecc71;font-size:14px;font-weight:bold">✅ ${r.mesaj}</div>`;
    showToast(r.mesaj, 'success');
    loadBuyuDukkani();
    if(typeof loadGameData==='function')loadGameData();
    setTimeout(() => { if(el) el.innerHTML = ''; }, 4000);
  } else {
    el.innerHTML = `<div style="padding:10px;background:rgba(231,76,60,0.15);border:1px solid #e74c3c;border-radius:6px;color:#e74c3c;font-size:13px">❌ ${r.error||'Hata'}</div>`;
    setTimeout(() => { if(el) el.innerHTML = ''; }, 5000);
  }
}

document.addEventListener('DOMContentLoaded', () => { setTimeout(loadBuyuDukkani, 1500); });
</script>
</body>
</html>
