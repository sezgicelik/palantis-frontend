<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noxara – Bug Bildir</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="css/main.css?v=13496">
<link rel="stylesheet" href="css/tema-parsomen.css?v=13496">
<style>
  .bug-form { display:grid; gap:12px; max-width:720px }
  .bug-form label { display:block; font-size:var(--fs-sm); color:#aaa; margin-bottom:4px }
  .bug-form input, .bug-form select, .bug-form textarea {
    width:100%; padding:8px 10px; background:#1a1a1a; border:1px solid #2a2a2a;
    color:#e8dcc8; border-radius:4px; font-size:var(--fs-base); font-family:inherit;
  }
  .bug-form textarea { min-height:140px; resize:vertical }
  .bug-form .hint { font-size:11px; color:#666; margin-top:2px }
  .tip-chip { display:inline-block; padding:2px 10px; border-radius:12px; font-size:11px; font-weight:bold }
  .tip-bug   { background:rgba(231,76,60,0.15); color:#e74c3c; border:1px solid rgba(231,76,60,0.35) }
  .tip-oneri { background:rgba(52,152,219,0.15); color:#3498db; border:1px solid rgba(52,152,219,0.35) }
  .tip-ui    { background:rgba(155,89,182,0.15); color:#9b59b6; border:1px solid rgba(155,89,182,0.35) }
  .tip-performans { background:rgba(230,126,34,0.15); color:#e67e22; border:1px solid rgba(230,126,34,0.35) }
  .tip-denge { background:rgba(26,188,156,0.15); color:#1abc9c; border:1px solid rgba(26,188,156,0.35) }
  .dur-chip { display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:bold }
  .dur-acik       { background:rgba(243,156,18,0.15); color:#f39c12 }
  .dur-inceleniyor{ background:rgba(52,152,219,0.15); color:#3498db }
  .dur-cozuldu    { background:rgba(46,204,113,0.15); color:#2ecc71 }
  .dur-reddedildi { background:rgba(149,165,166,0.15); color:#95a5a6 }
  .bildirim-row { padding:10px 12px; background:#0d0d0d; border:1px solid #1a1a1a; border-radius:4px; margin-bottom:6px }
  .bildirim-row .b-head { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:4px }
  .bildirim-row .b-title { font-size:var(--fs-base); color:#e8dcc8; font-weight:600 }
  .bildirim-row .b-meta  { font-size:11px; color:#666 }
  .bildirim-row .b-admin { margin-top:6px; padding:6px 10px; background:#0a0a0a; border-left:3px solid #d4a257; font-size:11px; color:#c8a96e }
</style>
</head>
<body>
<div id="hudbar-mount"></div>
<div class="layout">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <h2 style="font-family:Cinzel,serif;color:var(--race-color);margin-bottom:6px">🐛 Bug Bildir</h2>
    <p style="font-size:var(--fs-sm);color:#888;margin-bottom:18px">
      Bir hata mi gordün? Bir oneri mi var? Buradan bildir. Admin inceledikten sonra bildirimin "cozuldu" durumuna gecer.
    </p>

    <!-- FORM -->
    <div class="card bug-form" id="bug-form-wrap">
      <div>
        <label for="bug-tip">Tip</label>
        <select id="bug-tip">
          <option value="bug">🔴 Bug (Hata)</option>
          <option value="oneri">🔵 Öneri / İstek</option>
          <option value="ui">🟣 UI / Görsel</option>
          <option value="performans">🟠 Performans (Yavaşlama)</option>
          <option value="denge">🟢 Denge (Balans)</option>
        </select>
      </div>
      <div>
        <label for="bug-baslik">Başlık (3-200 karakter)</label>
        <input id="bug-baslik" type="text" maxlength="200" placeholder="Ornek: Ordu yonetiminde saldir butonu calismıyor">
      </div>
      <div>
        <label for="bug-aciklama">Açıklama (10-5000 karakter)</label>
        <textarea id="bug-aciklama" maxlength="5000" placeholder="Ne yaptin, ne bekliyordun, ne oldu? Adim adim yaz."></textarea>
        <div class="hint">Ipucu: Hatanin ne zaman oldugunu, tarayicini, hangi sayfada oldugunu yaz — admin hizli cozer.</div>
      </div>
      <div>
        <label for="bug-ekran">Ekran goruntusu URL (opsiyonel)</label>
        <input id="bug-ekran" type="url" placeholder="https://imgur.com/... (Imgur vs bir yere yukle, linki yapistir)">
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="btn" onclick="bugGonder()" style="padding:10px 24px">📤 Bildirimi Gönder</button>
        <span id="bug-msg" style="font-size:var(--fs-sm)"></span>
      </div>
    </div>

    <!-- GONDERILENLER -->
    <h3 style="font-family:Cinzel,serif;color:var(--race-color);margin:24px 0 10px">📋 Gönderdiğin Bildirimler</h3>
    <div id="bug-list">Yükleniyor...</div>

  </div>
</div>

<div id="toast"></div>
<script src="js/constants.js?v=13504"></script><script src="js/utils.js?v=13500"></script><script src="js/servers.js"></script>
<script src="js/auth.js"></script><script src="js/toast.js"></script><script src="js/theme.js"></script>
<script src="js/cache-fetch.js"></script>
<script src="js/game-data.js?v=13499"></script>
<script src="js/hud.js?v=13500"></script>
<script src="js/nufus-render.js"></script><script src="js/layout.js?v=13504"></script>
<script>
function hdr() { return { 'Authorization': 'Bearer ' + (localStorage.getItem('palantis_token')||''), 'Content-Type': 'application/json' }; }

async function bugGonder() {
  const msg = document.getElementById('bug-msg');
  const tip     = document.getElementById('bug-tip').value;
  const baslik  = document.getElementById('bug-baslik').value.trim();
  const aciklama= document.getElementById('bug-aciklama').value.trim();
  const ekran   = document.getElementById('bug-ekran').value.trim();
  if (baslik.length < 3) { msg.textContent = '⚠️ Baslik en az 3 karakter'; msg.style.color = '#e74c3c'; return; }
  if (aciklama.length < 10) { msg.textContent = '⚠️ Aciklama en az 10 karakter'; msg.style.color = '#e74c3c'; return; }
  msg.textContent = 'Gonderiliyor...'; msg.style.color = '#888';
  const body = {
    tip, baslik, aciklama,
    ekran_url: ekran,
    sayfa: document.referrer || 'bug-bildir.html',
    browser_info: navigator.userAgent.substring(0, 300),
  };
  try {
    const r = await fetch(API_BASE + '/api/bug/bildir', { method:'POST', headers:hdr(), body:JSON.stringify(body) });
    const d = await r.json();
    if (d.ok) {
      msg.textContent = '✓ ' + d.mesaj; msg.style.color = '#2ecc71';
      document.getElementById('bug-baslik').value = '';
      document.getElementById('bug-aciklama').value = '';
      document.getElementById('bug-ekran').value = '';
      loadBenimBildirimler();
    } else {
      msg.textContent = 'Hata: ' + (d.error || r.status); msg.style.color = '#e74c3c';
    }
  } catch (e) { msg.textContent = 'Hata: ' + e.message; msg.style.color = '#e74c3c'; }
}

async function loadBenimBildirimler() {
  const el = document.getElementById('bug-list');
  try {
    const r = await fetch(API_BASE + '/api/bug/benim', { headers: hdr() });
    const d = await r.json();
    if (!d.ok) { el.innerHTML = '<div style="color:#e74c3c">Yuklenemedi: ' + (d.error || '?') + '</div>'; return; }
    if (!d.bildirimler.length) {
      el.innerHTML = '<div style="color:#666;padding:20px;text-align:center">Henüz bildirim göndermedin.</div>'; return;
    }
    const fmt = (x) => x ? new Date(x).toLocaleString('tr-TR') : '-';
    el.innerHTML = d.bildirimler.map(b => `
      <div class="bildirim-row">
        <div class="b-head">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span class="tip-chip tip-${b.tip}">${b.tip.toUpperCase()}</span>
            <span class="b-title">${escapeHtml(b.baslik)}</span>
          </div>
          <span class="dur-chip dur-${b.durum}">${b.durum}</span>
        </div>
        <div class="b-meta">📅 ${fmt(b.created_at)} ${b.updated_at && b.updated_at !== b.created_at ? '· Güncellendi: ' + fmt(b.updated_at) : ''}</div>
        ${b.admin_notu ? `<div class="b-admin">💬 <b>Admin:</b> ${escapeHtml(b.admin_notu)}</div>` : ''}
      </div>`).join('');
  } catch (e) {
    el.innerHTML = '<div style="color:#e74c3c">Yuklenemedi: ' + e.message + '</div>';
  }
}

function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Layout yuklendikten sonra cagir
setTimeout(loadBenimBildirimler, 300);
</script>
<script src="js/sw-register.js?v=13467"></script>
</body></html>
