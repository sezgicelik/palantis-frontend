<script type="text/babel" data-type="module">
/* ═══════════════════════════════════════════════════════
   NOXARA CODEX — v1.14.0.54
   - Data externalize (codex-data.js)
   - Backend discovered API + localStorage fallback
   - Graph view (canvas force-directed)
   - Ctrl+K search
═══════════════════════════════════════════════════════ */

const { useState, useMemo, useEffect, useRef, useCallback } = React;

const KATEGORILER = window.CODEX_KATEGORILER;
const NODES = window.CODEX_NODES;
const BAG_LABEL = window.CODEX_BAG_LABEL;

const API_BASE_CODEX = (typeof API_BASE !== 'undefined' ? API_BASE : '');

/* ══ LOCALSTORAGE + API kesif sistemi ══ */
function useKesifDurum() {
  const [cag, setCag] = useState(() => parseInt(localStorage.getItem('codex_sim_cag') || '1'));
  const [kesfedilen, setKesfedilen] = useState(() => {
    try { return new Set(JSON.parse(localStorage.getItem('codex_kesfedilen') || '[]')); } catch { return new Set(); }
  });

  // Backend'den fetch (login varsa)
  useEffect(() => {
    const token = localStorage.getItem('palantis_token');
    if (!token || !API_BASE_CODEX) return;
    fetch(API_BASE_CODEX + '/api/codex/discovered', { headers:{ 'Authorization':'Bearer '+token } })
      .then(r => r.json())
      .then(d => {
        if (d?.ok && Array.isArray(d.discovered)) {
          setKesfedilen(prev => {
            const merged = new Set([...prev, ...d.discovered]);
            localStorage.setItem('codex_kesfedilen', JSON.stringify([...merged]));
            return merged;
          });
        }
      })
      .catch(()=>{});
  }, []);

  useEffect(() => { localStorage.setItem('codex_sim_cag', String(cag)); }, [cag]);
  useEffect(() => { localStorage.setItem('codex_kesfedilen', JSON.stringify([...kesfedilen])); }, [kesfedilen]);

  const kesfet = useCallback((id) => {
    setKesfedilen(prev => {
      if (prev.has(id)) return prev;
      const s = new Set(prev); s.add(id);
      // Backend'e fire-and-forget
      const token = localStorage.getItem('palantis_token');
      if (token && API_BASE_CODEX) {
        fetch(API_BASE_CODEX + '/api/codex/discover', {
          method:'POST',
          headers:{ 'Authorization':'Bearer '+token, 'Content-Type':'application/json' },
          body: JSON.stringify({ node_id: id })
        }).catch(()=>{});
      }
      return s;
    });
  }, []);

  return { cag, setCag, kesfedilen, kesfet };
}

function isKilitli(node, cag) {
  if (!node.kilit?.aktif) return false;
  if (node.kilit.sart?.tip === 'cag' && cag >= node.kilit.sart.deger) return false;
  return true;
}

/* ══ GRAPH VIEW — Canvas force-directed ══ */
function GraphView({ cag, kesfedilen, onSec, filtreliNodes, seciliId }) {
  const canvasRef = useRef(null);
  const nodesRef = useRef([]);
  const edgesRef = useRef([]);
  const rafRef = useRef(null);
  const panRef = useRef({ x: 0, y: 0, dragging: false, lastX: 0, lastY: 0 });
  const hoveredRef = useRef(null);
  const [hoveredId, setHoveredId] = useState(null);
  const [edgeCount, setEdgeCount] = useState(0);

  useEffect(() => {
    const nodeMap = Object.fromEntries(filtreliNodes.map(n => [n.id, n]));
    // init nodes (keep position if reused)
    const prevMap = Object.fromEntries(nodesRef.current.map(p => [p.id, p]));
    const W = 800, H = 600;
    nodesRef.current = filtreliNodes.map((n, i) => {
      const prev = prevMap[n.id];
      if (prev) return { ...prev, ...n };
      const angle = (i / filtreliNodes.length) * Math.PI * 2;
      return {
        ...n,
        x: W/2 + Math.cos(angle) * 200 + (Math.random()-0.5) * 40,
        y: H/2 + Math.sin(angle) * 200 + (Math.random()-0.5) * 40,
        vx: 0, vy: 0,
      };
    });
    // build edges (only between filtered nodes)
    const edges = [];
    for (const n of filtreliNodes) {
      for (const b of (n.baglantilar || [])) {
        if (nodeMap[b.id]) edges.push({ from: n.id, to: b.id, tip: b.tip });
      }
    }
    edgesRef.current = edges;
    setEdgeCount(edges.length);
  }, [filtreliNodes]);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const resize = () => {
      const r = canvas.getBoundingClientRect();
      canvas.width = r.width * dpr; canvas.height = r.height * dpr;
      ctx.setTransform(dpr,0,0,dpr,0,0);
    };
    resize();
    window.addEventListener('resize', resize);

    const REPEL = 4500;
    const SPRING = 0.02;
    const DAMP = 0.88;
    const CENTER = 0.002;

    function tick() {
      const nodes = nodesRef.current;
      const edges = edgesRef.current;
      const r = canvas.getBoundingClientRect();
      const cx = r.width / 2, cy = r.height / 2;

      // repel pairs
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i+1; j < nodes.length; j++) {
          const a = nodes[i], b = nodes[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const d2 = Math.max(30, dx*dx + dy*dy);
          const f = REPEL / d2;
          const d = Math.sqrt(d2);
          const fx = (dx/d) * f, fy = (dy/d) * f;
          a.vx -= fx; a.vy -= fy;
          b.vx += fx; b.vy += fy;
        }
      }
      // spring edges
      const nodeMap = Object.fromEntries(nodes.map(n => [n.id, n]));
      for (const e of edges) {
        const a = nodeMap[e.from], b = nodeMap[e.to];
        if (!a || !b) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        a.vx += dx * SPRING; a.vy += dy * SPRING;
        b.vx -= dx * SPRING; b.vy -= dy * SPRING;
      }
      // center pull
      for (const n of nodes) {
        n.vx += (cx - n.x) * CENTER;
        n.vy += (cy - n.y) * CENTER;
        n.vx *= DAMP; n.vy *= DAMP;
        n.x += n.vx; n.y += n.vy;
      }

      // render
      ctx.clearRect(0, 0, r.width, r.height);
      ctx.save();
      ctx.translate(panRef.current.x, panRef.current.y);
      // edges
      ctx.globalAlpha = 0.25;
      for (const e of edges) {
        const a = nodeMap[e.from], b = nodeMap[e.to];
        if (!a || !b) continue;
        ctx.strokeStyle = BAG_LABEL[e.tip]?.renk || '#666';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      // nodes
      for (const n of nodes) {
        const kilitli = isKilitli(n, cag);
        const kat = KATEGORILER.find(k => k.id === n.kategori);
        const isSel = n.id === seciliId;
        const isHover = n.id === hoveredRef.current;
        const R = isSel || isHover ? 20 : 14;
        ctx.fillStyle = kilitli ? '#1a1a1a' : (kat?.renk || '#d4a257');
        ctx.strokeStyle = isSel ? '#fff' : (kilitli ? '#333' : '#000');
        ctx.lineWidth = isSel ? 3 : (isHover ? 2 : 1);
        ctx.beginPath(); ctx.arc(n.x, n.y, R, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        // icon label
        ctx.fillStyle = '#fff';
        ctx.font = `${R}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(kilitli ? '🔒' : n.ikon, n.x, n.y);
        // name label (hover/selected only)
        if (isSel || isHover) {
          ctx.font = 'bold 11px sans-serif';
          ctx.fillStyle = '#fff';
          ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
          const txt = kilitli ? '???' : n.baslik;
          ctx.strokeText(txt, n.x, n.y + R + 12);
          ctx.fillText(txt, n.x, n.y + R + 12);
        }
      }
      ctx.restore();
      rafRef.current = requestAnimationFrame(tick);
    }
    tick();

    function getPointerNode(evt) {
      const r = canvas.getBoundingClientRect();
      const x = evt.clientX - r.left - panRef.current.x;
      const y = evt.clientY - r.top - panRef.current.y;
      for (const n of nodesRef.current) {
        const dx = n.x - x, dy = n.y - y;
        if (dx*dx + dy*dy < 20*20) return n;
      }
      return null;
    }
    function onMove(e) {
      const n = getPointerNode(e);
      hoveredRef.current = n?.id || null;
      if ((n?.id || null) !== hoveredId) setHoveredId(n?.id || null);
      if (panRef.current.dragging) {
        panRef.current.x += e.clientX - panRef.current.lastX;
        panRef.current.y += e.clientY - panRef.current.lastY;
        panRef.current.lastX = e.clientX; panRef.current.lastY = e.clientY;
      }
    }
    function onDown(e) {
      const n = getPointerNode(e);
      if (n) { onSec(n.id); return; }
      panRef.current.dragging = true;
      panRef.current.lastX = e.clientX; panRef.current.lastY = e.clientY;
    }
    function onUp() { panRef.current.dragging = false; }

    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerdown', onDown);
    window.addEventListener('pointerup', onUp);

    return () => {
      cancelAnimationFrame(rafRef.current);
      window.removeEventListener('resize', resize);
      canvas.removeEventListener('pointermove', onMove);
      canvas.removeEventListener('pointerdown', onDown);
      window.removeEventListener('pointerup', onUp);
    };
  }, [cag, seciliId, hoveredId]);

  return (
    <div className="relative w-full h-[60vh] md:h-[70vh] bg-black/30 rounded border border-white/10">
      <canvas id="codex-graph-canvas" ref={canvasRef} className="absolute inset-0 w-full h-full" />
      <div className="absolute top-2 left-2 bg-black/70 text-xs px-2 py-1 rounded pointer-events-none text-nox-dim">
        {filtreliNodes.length} node · {edgeCount} bağlantı · sürükle/tıkla
      </div>
    </div>
  );
}

/* ══ Mevcut node detay + ilişkili panelleri ══ */
function StatGrid({ stats }) {
  const entries = Object.entries(stats);
  if (!entries.length) return null;
  return (
    <div className="grid grid-cols-3 sm:grid-cols-4 gap-2 my-3">
      {entries.map(([k, v]) => (
        <div key={k} className="bg-black/30 rounded p-2 text-center border border-white/5">
          <div className="text-[10px] uppercase tracking-wider text-nox-dim">{k}</div>
          <div className="text-sm font-bold text-nox-gold cx-h">{v}</div>
        </div>
      ))}
    </div>
  );
}

function NodeKart({ node, onClick, kilitli, kesfedilen }) {
  const kat = KATEGORILER.find(k => k.id === node.kategori);
  return (
    <button onClick={onClick}
      className={`text-left p-3 rounded border transition hover:-translate-y-0.5 ${kilitli ? 'cx-kilit border-white/10 opacity-60' : 'border-white/10 hover:border-nox-gold'}`}
      style={{ background: kilitli ? 'rgba(20,18,14,0.4)' : 'rgba(20,18,14,0.85)' }}>
      <div className="flex items-center gap-2 mb-1">
        <span className="text-2xl">{kilitli ? '🔒' : node.ikon}</span>
        <div className="flex-1 min-w-0">
          <div className="text-sm font-bold truncate" style={{ color: kat?.renk || '#d4a257' }}>
            {kilitli ? '???' : node.baslik}
            {node.tier && <span className="ml-1 text-xs opacity-60">{node.tier}</span>}
            {!kilitli && !kesfedilen.has(node.id) && <span className="ml-1 text-xs text-nox-gold cx-pulse">YENİ</span>}
          </div>
          <div className="text-xs text-nox-dim truncate">{kilitli ? node.kilit.ipucu : node.ozet}</div>
        </div>
      </div>
    </button>
  );
}

function NodeDetay({ node, onGit, breadcrumb, geri, kilitli }) {
  const kat = KATEGORILER.find(k => k.id === node.kategori);
  if (kilitli) {
    return (
      <div className="cx-fade-in p-6 text-center">
        <div className="text-6xl mb-4">🔒</div>
        <div className="cx-h-big text-2xl text-nox-dim mb-2">Kilitli</div>
        <div className="text-nox-dim mb-4">{node.kilit.ipucu}</div>
        {geri && <button onClick={geri} className="text-nox-gold hover:underline text-sm">← Geri</button>}
      </div>
    );
  }
  return (
    <div className="cx-fade-in">
      {breadcrumb.length > 1 && (
        <div className="flex items-center gap-1 mb-3 text-xs text-nox-dim overflow-x-auto cx-scroll">
          <button onClick={geri} className="hover:text-nox-gold">←</button>
          {breadcrumb.map((b, i) => (
            <span key={i} className="flex items-center gap-1">
              {i > 0 && <span className="opacity-40">›</span>}
              <span className={i === breadcrumb.length - 1 ? 'text-nox-gold' : ''}>{b}</span>
            </span>
          ))}
        </div>
      )}
      <div className="flex items-start gap-3 mb-3">
        <div className="text-5xl">{node.ikon}</div>
        <div className="flex-1 min-w-0">
          <div className="cx-h-big text-xl md:text-2xl" style={{ color: kat?.renk || '#d4a257' }}>{node.baslik}</div>
          <div className="flex items-center gap-2 mt-1 text-xs flex-wrap">
            <span className="px-2 py-0.5 rounded-full" style={{ background: `${kat?.renk}22`, color: kat?.renk, border: `1px solid ${kat?.renk}55` }}>
              {kat?.ikon} {kat?.isim}
            </span>
            {node.tier && <span className="px-2 py-0.5 rounded-full bg-white/10">{node.tier}</span>}
          </div>
          <div className="text-nox-text mt-2">{node.ozet}</div>
        </div>
      </div>
      {node.stats && <StatGrid stats={node.stats} />}
      {node.aciklama && <div className="cx-drop text-sm leading-relaxed my-3">{node.aciklama}</div>}
    </div>
  );
}

function IliskiliPanel({ node, nodeMap, onGit, cag }) {
  if (!node.baglantilar?.length) return <div className="text-nox-dim text-sm p-4 text-center">İlişkili node yok.</div>;
  const grouped = {};
  node.baglantilar.forEach(b => {
    const hedef = nodeMap[b.id];
    if (!hedef) return;
    if (!grouped[b.tip]) grouped[b.tip] = [];
    grouped[b.tip].push(hedef);
  });
  return (
    <div className="flex flex-col gap-3 p-2">
      {Object.entries(grouped).map(([tip, nodes]) => {
        const meta = BAG_LABEL[tip] || BAG_LABEL.ilgili;
        return (
          <div key={tip}>
            <div className="cx-h text-xs uppercase tracking-wider mb-1 flex items-center gap-1" style={{ color: meta.renk }}>
              <span>{meta.ikon}</span><span>{meta.label}</span>
            </div>
            <div className="flex flex-col gap-1.5">
              {nodes.map(n => {
                const kilitli = isKilitli(n, cag);
                const kat = KATEGORILER.find(k => k.id === n.kategori);
                return (
                  <button key={n.id} onClick={() => onGit(n.id)}
                    className="text-left p-2 rounded border transition hover:-translate-x-0.5 hover:border-nox-gold flex items-center gap-2"
                    style={{ borderColor: 'rgba(255,255,255,0.08)', background: 'rgba(20,18,14,0.5)' }}>
                    <span className="text-base">{kilitli ? '🔒' : n.ikon}</span>
                    <span className="text-sm flex-1 truncate" style={{ color: kat?.renk || '#d4a257' }}>
                      {kilitli ? '???' : n.baslik}
                    </span>
                    <span className="text-xs text-nox-dim">→</span>
                  </button>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function Arama({ value, setValue, aktifSonuclar, onSec }) {
  return (
    <div className="relative">
      <input id="codex-arama-input" value={value}
        onChange={e => setValue(e.target.value)}
        placeholder="🔍 Ara... (Ctrl+K)"
        className="w-full px-3 py-2 bg-black/40 border border-white/10 rounded text-sm text-nox-text focus:border-nox-gold focus:outline-none" />
      {value && aktifSonuclar.length > 0 && (
        <div className="absolute top-full left-0 right-0 mt-1 bg-nox-dark border border-nox-gold/50 rounded shadow-xl z-30 max-h-64 overflow-y-auto cx-scroll">
          {aktifSonuclar.slice(0, 8).map(n => (
            <button key={n.id} onClick={() => { onSec(n.id); setValue(''); }}
              className="w-full text-left px-3 py-2 hover:bg-white/5 flex items-center gap-2 border-b border-white/5">
              <span>{n.ikon}</span>
              <span className="text-sm flex-1 truncate">{n.baslik}</span>
              <span className="text-xs text-nox-dim">{KATEGORILER.find(k => k.id === n.kategori)?.isim}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* ══ ANA APP ══ */
function CodexApp() {
  const { cag, setCag, kesfedilen, kesfet } = useKesifDurum();
  const [aktifKategori, setAktifKategori] = useState(null);
  const [viewMode, setViewMode] = useState('list');
  const [secili, setSecili] = useState(() => {
    const qs = new URLSearchParams(window.location.search);
    return qs.get('node') || 'piyade';
  });
  const [breadcrumb, setBreadcrumb] = useState([NODES.find(n=>n.id===(new URLSearchParams(window.location.search).get('node')||'piyade'))?.baslik || 'Piyade']);
  const [history, setHistory] = useState([secili]);
  const [arama, setArama] = useState('');
  const [mobileDrawer, setMobileDrawer] = useState(false);
  const [mobileTab, setMobileTab] = useState('detay');

  const nodeMap = useMemo(() => Object.fromEntries(NODES.map(n => [n.id, n])), []);
  const filtreliNodes = useMemo(() => {
    if (!aktifKategori) return NODES;
    return NODES.filter(n => n.kategori === aktifKategori);
  }, [aktifKategori]);
  const aramaSonuclari = useMemo(() => {
    if (!arama || arama.length < 2) return [];
    const q = arama.toLowerCase();
    return NODES.filter(n =>
      n.baslik.toLowerCase().includes(q) || n.ozet.toLowerCase().includes(q) || n.id.includes(q)
    );
  }, [arama]);

  const selNode = nodeMap[secili];
  const selKilitli = selNode ? isKilitli(selNode, cag) : false;
  useEffect(() => { if (selNode && !selKilitli) kesfet(selNode.id); }, [secili, selKilitli]);

  const git = useCallback((id) => {
    const node = nodeMap[id];
    if (!node) return;
    setSecili(id);
    setBreadcrumb(prev => [...prev, node.baslik].slice(-5));
    setHistory(prev => [...prev, id]);
    setMobileTab('detay');
    setMobileDrawer(false);
  }, [nodeMap]);

  const geri = () => {
    if (history.length <= 1) return;
    const yeni = history.slice(0, -1);
    setHistory(yeni);
    setSecili(yeni[yeni.length - 1]);
    setBreadcrumb(prev => prev.slice(0, -1));
  };

  useEffect(() => {
    const h = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById('codex-arama-input')?.focus();
      }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);

  return (
    <div className="cx-wrap min-h-screen">
      <div className="sticky top-0 bg-nox-dark/95 backdrop-blur border-b border-nox-gold/30 z-20 p-3 md:p-4">
        <div className="flex items-center gap-2 md:gap-4 flex-wrap">
          <button onClick={() => setMobileDrawer(v => !v)} className="md:hidden px-3 py-2 bg-white/10 rounded">☰</button>
          <h1 className="cx-h-big text-lg md:text-2xl text-nox-gold flex-shrink-0">📖 Codex</h1>
          <div className="flex-1 min-w-[180px]">
            <Arama value={arama} setValue={setArama} aktifSonuclar={aramaSonuclari} onSec={git} />
          </div>
          {/* View toggle */}
          <div className="flex gap-1 bg-black/40 rounded p-0.5 border border-white/10">
            <button onClick={() => setViewMode('list')}
              className={`px-2 py-1 text-xs rounded cx-h ${viewMode==='list' ? 'bg-nox-gold/20 text-nox-gold' : 'text-nox-dim'}`}>📋 Liste</button>
            <button onClick={() => setViewMode('graph')}
              className={`px-2 py-1 text-xs rounded cx-h ${viewMode==='graph' ? 'bg-nox-gold/20 text-nox-gold' : 'text-nox-dim'}`}>🕸 Graph</button>
          </div>
          <div className="flex items-center gap-1 text-xs">
            <span className="text-nox-dim hidden sm:inline">Çağ:</span>
            <select value={cag} onChange={e => setCag(parseInt(e.target.value))} className="bg-black/40 border border-white/10 px-2 py-1 rounded">
              {[1,2,3,4,5].map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
        </div>
      </div>

      <div className="flex">
        <aside className={`fixed md:static inset-y-0 left-0 z-30 bg-nox-dark border-r border-nox-gold/20 w-56 transform transition ${mobileDrawer ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 md:flex-shrink-0 overflow-y-auto cx-scroll pt-16 md:pt-0`}>
          <div className="cx-h text-xs uppercase tracking-wider text-nox-gold p-3">Kategoriler</div>
          <div className="flex flex-col gap-1 p-2">
            <button onClick={() => setAktifKategori(null)}
              className={`text-left px-3 py-2 rounded text-sm cx-h ${aktifKategori===null ? 'bg-nox-gold/20 text-nox-gold border-l-2 border-nox-gold' : 'hover:bg-white/5'}`}>🌑 Tümü ({NODES.length})</button>
            {KATEGORILER.map(k => {
              const count = NODES.filter(n => n.kategori === k.id).length;
              return (
                <button key={k.id} onClick={() => setAktifKategori(k.id)}
                  className={`text-left px-3 py-2 rounded text-sm cx-h flex items-center gap-2 ${aktifKategori===k.id ? 'bg-white/10' : 'hover:bg-white/5'}`}
                  style={aktifKategori===k.id ? { borderLeft: `2px solid ${k.renk}`, color: k.renk } : {}}>
                  <span className="text-lg">{k.ikon}</span>
                  <span className="flex-1">{k.isim}</span>
                  <span className="text-xs opacity-60">{count}</span>
                </button>
              );
            })}
          </div>
          {viewMode === 'list' && (
            <>
              <div className="cx-h text-xs uppercase tracking-wider text-nox-gold p-3 pt-6">Node\'lar ({filtreliNodes.length})</div>
              <div className="flex flex-col gap-1 p-2">
                {filtreliNodes.map(n => (
                  <NodeKart key={n.id} node={n} onClick={() => git(n.id)} kilitli={isKilitli(n, cag)} kesfedilen={kesfedilen} />
                ))}
              </div>
            </>
          )}
        </aside>

        {mobileDrawer && <div onClick={() => setMobileDrawer(false)} className="md:hidden fixed inset-0 bg-black/60 z-20" />}

        <main className="flex-1 min-w-0 p-3 md:p-6">
          {viewMode === 'graph' ? (
            <div>
              <GraphView cag={cag} kesfedilen={kesfedilen} onSec={git} filtreliNodes={filtreliNodes} seciliId={secili} />
              <div className="mt-4 p-3 border border-white/10 rounded bg-black/30">
                {selNode && <NodeDetay node={selNode} onGit={git} breadcrumb={breadcrumb}
                              geri={history.length > 1 ? geri : null} kilitli={selKilitli} />}
              </div>
            </div>
          ) : (
            <>
              <div className="md:hidden flex gap-2 mb-3">
                {[['detay','📖 Detay'],['ilgili','🔗 İlişkili']].map(([k,l]) => (
                  <button key={k} onClick={() => setMobileTab(k)}
                    className={`flex-1 py-2 rounded text-sm cx-h ${mobileTab===k ? 'bg-nox-gold/20 border border-nox-gold text-nox-gold' : 'bg-white/5'}`}>{l}</button>
                ))}
              </div>
              <div className={mobileTab === 'detay' ? 'block' : 'hidden md:block'}>
                {selNode && <NodeDetay node={selNode} onGit={git} breadcrumb={breadcrumb}
                              geri={history.length > 1 ? geri : null} kilitli={selKilitli} />}
              </div>
              <div className={mobileTab === 'ilgili' ? 'block md:hidden' : 'hidden'}>
                {selNode && !selKilitli && <IliskiliPanel node={selNode} nodeMap={nodeMap} onGit={git} cag={cag} />}
              </div>
            </>
          )}
        </main>

        {viewMode === 'list' && (
          <aside className="hidden md:block w-64 border-l border-nox-gold/20 bg-black/30 flex-shrink-0 overflow-y-auto cx-scroll">
            <div className="cx-h text-xs uppercase tracking-wider text-nox-gold p-3 sticky top-0 bg-nox-dark/95 backdrop-blur">İlişkili</div>
            {selNode && !selKilitli && <IliskiliPanel node={selNode} nodeMap={nodeMap} onGit={git} cag={cag} />}
          </aside>
        )}
      </div>

      <div className="fixed bottom-2 right-2 text-xs text-nox-dim bg-black/70 px-3 py-1.5 rounded border border-white/10 pointer-events-none">
        <kbd className="px-1 py-0.5 bg-white/10 rounded text-[10px]">Ctrl+K</kbd> ara · Keşfedilen: {kesfedilen.size}/{NODES.length}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('codex-root')).render(<CodexApp />);
</script>
</body></html>
