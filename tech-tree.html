<script>
// ════════════════════════════════════════════════════════════
// CONFIG: 16 sehir gel + 2 askeri + cag atlama + 28 birim
// (Backend SEHIR_GEL ve UNITS ile bire bir uyumlu)
// ════════════════════════════════════════════════════════════
const SEHIR_GEL_META = {
  // KAYNAK

  ticaret_gel:   { isim:'Ticaret',        icon:'storefront', etki:'Markette değerli +%1/sv',     dal:'hammadde' },
  // ISLEME
  kereste_gel:   { isim:'Kereste',        icon:'park',       etki:'Kereste verimi +%1/sv',       dal:'isleme' },
  metal_gel:     { isim:'Metal İşleme',   icon:'handyman',   etki:'İşlenmiş metal +%1/sv',       dal:'isleme' },
  firin_gel:     { isim:'Fırın',          icon:'restaurant', etki:'Ekmek+pişmiş +%1/sv',         dal:'isleme' },
  et_gel:        { isim:'Et İşleme',      icon:'lunch_dining',etki:'Pişmiş et verimi +%1/sv',    dal:'isleme' },
  // EKONOMI
  vergi_gel:     { isim:'Vergi Toleransı',icon:'payments',   etki:'Vergi moral cezası -%1/sv',   dal:'ekonomi' },
  insaat_gel:    { isim:'İnşaat',         icon:'engineering',etki:'Bina maliyeti -%1/sv',        dal:'ekonomi' },
  essek_gel:     { isim:'Eşek Şansı',    icon:'pets',       etki:'Pazarda eşek bulma +%0.1/sv', dal:'ekonomi' },
  // SEHIR YAPI
  ahir_gel:      { isim:'Ahır',           icon:'shield_moon',etki:'At/Kurt üretim +%1/sv',       dal:'yapi' },
  lonca_gel:     { isim:'Lonca',          icon:'visibility_off',etki:'Gizlilik +%1/sv',          dal:'yapi' },
  buyulu_gel:    { isim:'Büyülü Tarla',   icon:'egg',        etki:'Büyülü yumurta +%1/sv',       dal:'yapi' },
  // MISTIK
  mana_gel:      { isim:'Mana Verimi',    icon:'auto_fix_high',etki:'Worshipper mana +%1/sv',    dal:'mistik' },
};

const ASKERI_META = {
  askeri_gel: { isim:'Askeri Geliştirme', icon:'shield',  etki:'Ünite eğitim altın -%10/sv', dal:'askeri' },
  maas_gel:   { isim:'Maaş İndirimi',     icon:'paid',    etki:'Ordu maaşı -%5/sv',          dal:'askeri' },
};

// CAG_MALIYETLERI (backend ile uyumlu — sadece UI gosterimi icin)
const CAG_ATLA = [
  { hedef:2, isim:'II. Çağ — Demir',   icon:'looks_two' },
  { hedef:3, isim:'III. Çağ — Altın',  icon:'looks_3'   },
  { hedef:4, isim:'IV. Çağ — Ejderha', icon:'looks_4'   },
  { hedef:5, isim:'V. Çağ — Kadim',    icon:'looks_5'   },
];

// 28 birim listesi — constants.js UNITS'tan turetilir
// (Yardimci essek/koylu haric — onlar gelistirilemez)
let BIRIM_LISTESI = [];
function birimListesiYap() {
  BIRIM_LISTESI = [];
  if (typeof UNITS !== 'object') return;
  for (const id in UNITS) {
    const u = UNITS[id];
    if (!u || u.tier === 0 || u.side === 'neutral') continue;
    BIRIM_LISTESI.push({ id, name: u.name, tier: u.tier, side: u.side });
  }
  BIRIM_LISTESI.sort((a,b) => a.tier - b.tier);
}

// Maliyet formulleri (backend ile bire bir)
function sehirGelMaliyet(kademe) { return { gp:  5*kademe, kp: 2*kademe, isl: 100*kademe }; }
function askeriMaliyet(kademe)   { return { gp: 10*kademe, kp: 5*kademe, isl: 100*kademe }; }
function gerekenCagSehir(kademe) { return Math.ceil(kademe / 2); } // 1-2→C1, 3-4→C2 ...

// ════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════
const TT = {
  cag: 1,
  resources: { gelisim_puani:0, kultur_puani:0, islenmis:0 },
  sehirGel: {},   // { gel_id: seviye }
  askeriGel: { askeri_gel_sev:0, maas_gel_sev:0 },
  uniteGel: {},   // { unite_id: { atk_sev, def_sev } }
  tumBirimGoster: false,
};

// ════════════════════════════════════════════════════════════
// API
// ════════════════════════════════════════════════════════════
// getToken auth.js'ten gelir; toast asagida
function toast(msg, renk) {
  const el = document.getElementById('ttToast');
  el.textContent = msg;
  el.style.borderColor = renk === 'red' ? '#ffb4ab' : (renk === 'green' ? '#7ed957' : '#f3bd6f');
  el.style.display = 'block';
  clearTimeout(window._ttToastT);
  window._ttToastT = setTimeout(() => el.style.display = 'none', 3500);
}

async function fetchAll() {
  const token = getToken();
  if (!token) {
    toast('Oturum bulunamadı, lütfen giriş yapın', 'red');
    setTimeout(() => location.href = 'index.html', 1500);
    return false;
  }
  const headers = { Authorization: 'Bearer ' + token };
  try {
    const [sehirR, gelistR, resR, cagR] = await Promise.all([
      fetch(API_BASE + '/api/game/sehir-gel',     { headers }),
      fetch(API_BASE + '/api/game/gelistirmeler', { headers }),
      fetch(API_BASE + '/api/game/resources',     { headers }),
      fetch(API_BASE + '/api/game/cag',           { headers }),
    ]);
    const statuses = {
      'sehir-gel':     sehirR.status,
      'gelistirmeler': gelistR.status,
      'resources':     resR.status,
      'cag':           cagR.status,
    };
    console.log('[tech-tree] status:', statuses);
    if (!sehirR.ok || !gelistR.ok || !resR.ok || !cagR.ok) {
      const failed = Object.entries(statuses).filter(([k,v]) => v !== 200).map(([k,v]) => `${k}=${v}`).join(', ');
      toast('Veri alınamadı: ' + failed, 'red');
      const dbg = document.getElementById('tt-loading');
      if (dbg) dbg.innerHTML = `
        <div style="text-align:left;max-width:600px;margin:0 auto;padding:20px;background:#1c1b1b;border:1px solid #ffb4ab;border-radius:8px">
          <h3 style="color:#ffb4ab;font-family:Cinzel,serif;margin-bottom:12px">⚠️ Veri Alınamadı</h3>
          <p style="color:#e5e2e1;margin-bottom:8px"><b>HTTP Status'lar:</b></p>
          <ul style="color:#d3c4b3;margin:8px 0 16px 20px">
            <li>/api/game/sehir-gel     → <b style="color:${sehirR.ok ? '#7ed957':'#ffb4ab'}">${sehirR.status}</b></li>
            <li>/api/game/gelistirmeler → <b style="color:${gelistR.ok ? '#7ed957':'#ffb4ab'}">${gelistR.status}</b></li>
            <li>/api/game/resources    → <b style="color:${resR.ok ? '#7ed957':'#ffb4ab'}">${resR.status}</b></li>
            <li>/api/game/cag          → <b style="color:${cagR.ok ? '#7ed957':'#ffb4ab'}">${cagR.status}</b></li>
          </ul>
          <p style="color:#9c8f7f;font-size:12px;margin-top:16px">401 = oturum sonlandı · 404 = endpoint yok · 500 = backend hatası</p>
          <a href="city.html" style="color:#f3bd6f;text-decoration:underline">← Krallığa dön</a>
        </div>`;
      return false;
    }
    const sehir   = await sehirR.json();
    const gelist  = await gelistR.json();
    const res     = await resR.json();
    const cagData = await cagR.json();

    // CAG
    TT.cag = cagData.cag || sehir.cag || 1;

    // SEHIR GEL — backend: { cag, gelistirmeler: [{id, seviye, ...}] }
    TT.sehirGel = {};
    (sehir.gelistirmeler || []).forEach(g => { TT.sehirGel[g.id] = g.seviye || 0; });

    // ASKERI + UNITE GEL — backend: { gelistirmeler: {askeri_gel_sev, maas_gel_sev}, unite_gel: {} }
    TT.askeriGel = gelist.gelistirmeler || { askeri_gel_sev:0, maas_gel_sev:0 };
    TT.uniteGel  = gelist.unite_gel     || {};

    // KAYNAKLAR — backend /resources resources tablosu satirini doner
    TT.resources.gelisim_puani = parseInt(res.gelisim_puani || 0);
    TT.resources.kultur_puani  = parseInt(res.kultur_puani  || 0);
    TT.resources.islenmis      = parseInt(res.islenmis      || 0);

    return true;
  } catch (e) {
    console.error('[tech-tree fetchAll]', e);
    toast('Bağlantı hatası: ' + e.message, 'red');
    // Sayfada gorunen debug paneli
    const dbg = document.getElementById('tt-loading');
    if (dbg) dbg.innerHTML = `
      <div style="text-align:left;max-width:600px;margin:0 auto;padding:20px;background:#1c1b1b;border:1px solid #ffb4ab;border-radius:8px">
        <h3 style="color:#ffb4ab;font-family:Cinzel,serif;margin-bottom:12px">⚠️ Bağlantı Hatası</h3>
        <p style="color:#e5e2e1;margin-bottom:8px"><b>Hata:</b> ${e.message}</p>
        <p style="color:#d3c4b3;margin-bottom:8px"><b>API_BASE:</b> ${typeof API_BASE !== 'undefined' ? API_BASE : 'TANIMSIZ!'}</p>
        <p style="color:#d3c4b3;margin-bottom:8px"><b>Token:</b> ${getToken() ? 'VAR (' + getToken().substring(0,20) + '...)' : 'YOK'}</p>
        <p style="color:#9c8f7f;font-size:12px;margin-top:16px">Bu bilgiyi geliştiriciye iletin.</p>
        <a href="city.html" style="color:#f3bd6f;text-decoration:underline">← Krallığa dön</a>
      </div>`;
    return false;
  }
}

// In-flight lock: ayni anda 1 upgrade istegi calissin
// Race condition onleme — kullanici 9 kere click atinca 9 paralel fetch atilmaz
let _ttBusy = false;

async function upgradeSehirGel(gelId) {
  if (_ttBusy) { toast('Lütfen bekleyin...', 'red'); return; }
  _ttBusy = true;
  const token = getToken();
  try {
    const r = await fetch(API_BASE + '/api/game/sehir-gel/yuksel', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ gel_id: gelId }),
    });
    const d = await r.json();
    if (!r.ok) { toast(d.error || 'Hata', 'red'); _ttBusy = false; return; }
    toast(d.mesaj || 'Yükseltildi', 'green');
    await fetchAll();
    render();
  } catch(e) { toast('Bağlantı hatası', 'red'); }
  finally { _ttBusy = false; }
}

async function upgradeAskeri(tip) {
  if (_ttBusy) { toast('Lütfen bekleyin...', 'red'); return; }
  _ttBusy = true;
  // tip: 'askeri' | 'maas'
  const token = getToken();
  try {
    const r = await fetch(API_BASE + '/api/army/gelistir', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ tip }),
    });
    const d = await r.json();
    if (!r.ok) { toast(d.error || 'Hata', 'red'); _ttBusy = false; return; }
    toast(tip === 'askeri' ? 'Askeri Geliştirme yükseltildi!' : 'Maaş İndirimi yükseltildi!', 'green');
    await fetchAll();
    render();
  } catch(e) { toast('Bağlantı hatası', 'red'); }
  finally { _ttBusy = false; }
}

async function upgradeUnite(uniteId, stat) {
  if (_ttBusy) { toast('Lütfen bekleyin...', 'red'); return; }
  _ttBusy = true;
  // stat: 'atk' | 'def'
  const token = getToken();
  try {
    const r = await fetch(API_BASE + '/api/army/gelistir', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ tip: 'unite_' + stat, unite_id: uniteId }),
    });
    const d = await r.json();
    if (!r.ok) { toast(d.error || 'Hata', 'red'); _ttBusy = false; return; }
    toast((UNITS[uniteId]?.name || uniteId) + ' ' + stat.toUpperCase() + ' yükseltildi!', 'green');
    await fetchAll();
    render();
  } catch(e) { toast('Bağlantı hatası', 'red'); }
  finally { _ttBusy = false; }
}

async function upgradeCag() {
  if (_ttBusy) { toast('Lütfen bekleyin...', 'red'); return; }
  if (!confirm('Çağ atlamak istediğinize emin misiniz? Bu işlem geri alınamaz.')) return;
  _ttBusy = true;
  const token = getToken();
  try {
    const r = await fetch(API_BASE + '/api/game/cag-atla', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    });
    const d = await r.json();
    if (!r.ok) { toast(d.error || 'Hata', 'red'); _ttBusy = false; return; }
    toast(`Çağ atlandı! Yeni: ${d.cag_isim}`, 'green');
    await fetchAll();
    render();
  } catch(e) { toast('Bağlantı hatası', 'red'); }
  finally { _ttBusy = false; }
}

// ════════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════════
function kart(opts) {
  // opts: { id, isim, icon, etki, sv, maxSv, cost, locked, lockSebep, action, actionArg, yetersiz }
  // action: 'sehir' | 'askeri' | 'unite_atk' | 'unite_def'
  // actionArg: gel_id | tip | unite_id
  const { id, isim, icon, etki, sv, maxSv, cost, locked, lockSebep, action, actionArg, yetersiz } = opts;
  const tamamlandi = sv >= maxSv;

  let bg, br, opacity = '';
  if (tamamlandi)        { bg = 'bg-surface-container-high'; br = 'border-primary'; }
  else if (locked)       { bg = 'bg-surface-container-lowest'; br = 'border-outline-variant/30'; opacity = 'opacity-40'; }
  else if (yetersiz)     { bg = 'bg-surface-container-low'; br = 'border-error/40'; opacity = 'opacity-80'; }
  else                   { bg = 'bg-surface-container-high'; br = 'border-primary/30'; }

  const titleColor = (tamamlandi || sv > 0) ? 'text-primary' : 'text-on-surface';
  const iconColor  = tamamlandi ? 'text-primary' : (sv > 0 ? 'text-primary/70' : 'text-on-surface-variant');

  let costHtml = '';
  if (tamamlandi) {
    costHtml = `<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings:'FILL' 1;">check_circle</span>`;
  } else if (locked) {
    costHtml = `<span class="text-[9px] text-on-surface-variant leading-tight">${lockSebep || 'Kilitli'}</span>`;
  } else if (cost) {
    costHtml = `<span class="text-[9px] ${yetersiz ? 'text-error' : 'text-primary'} leading-tight text-right">${cost.gp}GP·${cost.kp}KP<br/>${cost.isl}İşl</span>`;
  }

  const tiklanabilir = !(tamamlandi || locked || yetersiz);
  const disabledClass = tiklanabilir ? '' : 'disabled';
  const dataAttrs = tiklanabilir
    ? `data-action="${action || ''}" data-arg="${actionArg || ''}"`
    : '';

  return `<div class="tt-card ${disabledClass} w-full h-[44px] ${bg} border ${br} rounded-md flex items-center px-3 gap-2 relative hover:border-primary transition-all ${opacity}" title="${etki}" data-id="${id}" ${dataAttrs}>
    <span class="material-symbols-outlined ${iconColor} text-sm">${icon}</span>
    <div class="flex-grow flex flex-col justify-center min-w-0">
      <span class="text-[10px] font-bold ${titleColor} leading-tight truncate">${isim}${sv > 0 ? ` (Sv ${sv}/${maxSv})` : ''}</span>
      <span class="text-[9px] text-on-surface-variant leading-tight truncate">${etki}</span>
    </div>
    ${costHtml}
  </div>`;
}

// Tek event delegation handler — sayfa basinda 1 kere baglanir
function ttCardClickHandler(e) {
  const card = e.target.closest('.tt-card[data-action]');
  if (!card || card.classList.contains('disabled')) return;
  const action = card.dataset.action;
  const arg    = card.dataset.arg;
  if (action === 'sehir')      upgradeSehirGel(arg);
  else if (action === 'askeri') upgradeAskeri(arg);
  else if (action === 'unite_atk') upgradeUnite(arg, 'atk');
  else if (action === 'unite_def') upgradeUnite(arg, 'def');
}

function birimKart(birim, stat) {
  // stat: 'atk' | 'def'
  const u = UNITS[birim.id];
  const gel = TT.uniteGel[birim.id] || { atk_sev:0, def_sev:0 };
  const sv = stat === 'atk' ? (gel.atk_sev || 0) : (gel.def_sev || 0);
  const maxSv = stat === 'atk' ? (u.atkGelMax || 10) : (u.defGelMax || 10);
  const sonraki = sv + 1;
  const cost = askeriMaliyet(sonraki);
  const yetersiz = (TT.resources.gelisim_puani < cost.gp) ||
                   (TT.resources.kultur_puani  < cost.kp) ||
                   (TT.resources.islenmis      < cost.isl);
  const sideIcon = birim.side === 'iyi' ? '🤍' : (birim.side === 'kotu' ? '🖤' : '');
  return kart({
    id: birim.id + '_' + stat,
    isim: sideIcon + ' ' + birim.name + ' ' + stat.toUpperCase(),
    icon: stat === 'atk' ? 'swords' : 'shield',
    etki: birim.name + ' ' + stat.toUpperCase() + ' her sv ile artar (Tier ' + birim.tier + ')',
    sv, maxSv,
    cost, locked:false, yetersiz,
    action: 'unite_' + stat, actionArg: birim.id,
  });
}

function render() {
  // Resources
  document.getElementById('tt-gp').textContent  = TT.resources.gelisim_puani.toLocaleString('tr-TR');
  document.getElementById('tt-kp').textContent  = TT.resources.kultur_puani.toLocaleString('tr-TR');
  document.getElementById('tt-isl').textContent = TT.resources.islenmis.toLocaleString('tr-TR');
  const cagRoman = ['','I','II','III','IV','V'][TT.cag] || TT.cag;
  document.getElementById('tt-cag').textContent = cagRoman;

  // Loading kapat, tree ac
  document.getElementById('tt-loading').style.display = 'none';
  document.getElementById('tt-tree').style.display    = 'flex';

  // 16 sehir geliştirmesi — 4 dala dagilir
  const dallar = { hammadde: [], isleme: [], ekonomi: [], yapi: [], mistik: [] };
  for (const id in SEHIR_GEL_META) {
    const meta = SEHIR_GEL_META[id];
    const sv = TT.sehirGel[id] || 0;
    const maxSv = 10;
    const sonraki = sv + 1;
    const cost = sehirGelMaliyet(sonraki);
    const gerekenC = gerekenCagSehir(sonraki);
    const cagYeter = TT.cag >= gerekenC;
    const locked = !cagYeter && sv < maxSv;
    const yetersiz = !locked && sv < maxSv && (
      TT.resources.gelisim_puani < cost.gp ||
      TT.resources.kultur_puani  < cost.kp ||
      TT.resources.islenmis      < cost.isl
    );
    const k = kart({
      id, isim: meta.isim, icon: meta.icon, etki: meta.etki,
      sv, maxSv, cost, locked, yetersiz,
      lockSebep: `Çağ ${gerekenC} gerekli`,
      action: 'sehir', actionArg: id,
    });
    if (dallar[meta.dal]) dallar[meta.dal].push(k);
  }

  // Askeri gelistirmeler (askeri + maas)
  const askeriKartlar = [];
  for (const id in ASKERI_META) {
    const meta = ASKERI_META[id];
    const sv = id === 'askeri_gel' ? (TT.askeriGel.askeri_gel_sev || 0) : (TT.askeriGel.maas_gel_sev || 0);
    const maxSv = Math.min(TT.cag * 3, 15);
    const sonraki = sv + 1;
    const cost = askeriMaliyet(sonraki);
    const tipKisa = id === 'askeri_gel' ? 'askeri' : 'maas';
    const yetersiz = sv < maxSv && (
      TT.resources.gelisim_puani < cost.gp ||
      TT.resources.kultur_puani  < cost.kp ||
      TT.resources.islenmis      < cost.isl
    );
    askeriKartlar.push(kart({
      id, isim: meta.isim, icon: meta.icon, etki: meta.etki + ' (Çağ ' + TT.cag + ' max: ' + maxSv + ')',
      sv, maxSv, cost, locked:false, yetersiz,
      action: 'askeri', actionArg: tipKisa,
    }));
  }

  // Cag atlama kartlari (4 atlama)
  const cagKartlari = [];
  CAG_ATLA.forEach(ca => {
    const tamamlandi = TT.cag >= ca.hedef;
    const locked = TT.cag < (ca.hedef - 1);
    const aktif = (TT.cag === ca.hedef - 1);
    const bg = tamamlandi ? 'bg-surface-container-high border-primary'
             : (locked ? 'bg-surface-container-lowest border-outline-variant/30 opacity-40'
                       : 'bg-surface-container-high border-primary/30');
    const handler = (aktif && !tamamlandi) ? `onclick="upgradeCag()"` : '';
    const cursor = (aktif && !tamamlandi) ? 'cursor:pointer' : 'cursor:default';
    cagKartlari.push(`<div class="tt-card w-full h-[44px] ${bg} border rounded-md flex items-center px-3 gap-2 relative hover:border-primary transition-all" style="${cursor}" ${handler}>
      <span class="material-symbols-outlined ${tamamlandi ? 'text-primary' : 'text-on-surface-variant'} text-sm">${ca.icon}</span>
      <div class="flex-grow flex flex-col justify-center min-w-0">
        <span class="text-[10px] font-bold ${tamamlandi ? 'text-primary' : 'text-on-surface'} leading-tight truncate">${ca.isim}</span>
        <span class="text-[9px] text-on-surface-variant leading-tight truncate">Çağ atlama</span>
      </div>
      ${tamamlandi ? `<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings:'FILL' 1;">check_circle</span>` :
        (locked ? `<span class="text-[9px] text-on-surface-variant">Önceki çağ gerek</span>` :
          `<span class="text-[9px] text-primary">Sehir/Asama</span>`)}
    </div>`);
  });

  // Mistik dal: mana_gel + 4 cag atlama
  const mistikKartlar = [...(dallar.mistik || []), ...cagKartlari];

  // Birimler (28 birim x 2 = 56, default ilk 3 birim x 2 = 6)
  const birimGoster = TT.tumBirimGoster ? BIRIM_LISTESI : BIRIM_LISTESI.slice(0, 3);
  const birimKartlar = [];
  birimGoster.forEach(b => {
    birimKartlar.push(birimKart(b, 'atk'));
    birimKartlar.push(birimKart(b, 'def'));
  });

  renderDal('dal-hammadde', dallar.hammadde);
  renderDal('dal-isleme',   dallar.isleme);
  renderDal('dal-ekonomi',  dallar.ekonomi);
  renderDal('dal-yapi',     dallar.yapi);
  renderDal('dal-askeri',   askeriKartlar);
  renderDal('dal-mistik',   mistikKartlar);
  renderDal('dal-birim',    birimKartlar);

  // Tum birim toggle
  const tBtn = document.getElementById('tt-toggle-tum-birim');
  if (tBtn) tBtn.textContent = TT.tumBirimGoster ? 'Sadece ilk 3 birim göster' : `Tümünü göster (${BIRIM_LISTESI.length} birim × 2)`;
}

function renderDal(domId, items) {
  const el = document.getElementById(domId);
  if (!el) return;
  el.innerHTML = items.map((it, idx) =>
    (idx > 0 ? '<div class="w-0.5 h-2 bg-primary/30"></div>' : '') + it
  ).join('');
}

// ════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  birimListesiYap();

  // Event delegation: tum kartlarin click'i tek listener'a bagli
  document.getElementById('tt-tree').addEventListener('click', ttCardClickHandler);

  const ok = await fetchAll();
  if (!ok) {
    document.getElementById('tt-loading').innerHTML =
      '<p class="text-error font-body-lg">Yüklenemedi. <a href="city.html" class="underline">Krallığa dön</a></p>';
    return;
  }
  render();

  // Filter chips
  const chips = document.querySelectorAll('.filter-chip');
  const cols = document.querySelectorAll('.tree-col');
  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      chips.forEach(c => {
        c.classList.remove('active','bg-primary/10','text-primary','border-primary');
        c.classList.add('border-outline-variant','text-on-surface-variant');
      });
      chip.classList.add('active','bg-primary/10','text-primary','border-primary');
      chip.classList.remove('border-outline-variant','text-on-surface-variant');
      const f = chip.dataset.filter;
      cols.forEach(col => {
        const c = col.dataset.col;
        let show;
        if (f === 'hepsi') show = true;
        else if (f === 'gp') show = (c === 'gp' || c === 'karma');
        else if (f === 'kp') show = (c === 'kp' || c === 'karma');
        col.style.display = show ? 'flex' : 'none';
      });
    });
  });

  // Tum birim toggle
  document.getElementById('tt-toggle-tum-birim')?.addEventListener('click', () => {
    TT.tumBirimGoster = !TT.tumBirimGoster;
    render();
  });

  // 60sn'de bir resource'lari yenile (ama bir upgrade islemi devam ediyorsa atla)
  setInterval(() => {
    if (_ttBusy) return; // upgrade isleminin ortasinda race condition olmasin
    fetchAll().then(ok => ok && render());
  }, 60000);
});
</script>
