<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noxara – Festival</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="css/main.css?v=13496">
<link rel="stylesheet" href="css/tema-parsomen.css?v=13496">
<link rel="stylesheet" href="css/rehber.css">
</head>
<body>
<div id="hudbar-mount"></div>
<div class="layout">
  <div id="sidebar-mount"></div>
  <div class="main-content">

    <!-- Şehir Morali Bar -->
    <div class="city-stats" style="margin-bottom:20px">
      <div class="cstat" title="Şehir halkının morali">
        <span class="snum" id="fest-moral">—</span>
        <span class="slbl">ŞEHİR MORALİ</span>
      </div>
      <div class="cstat" title="Çağ bazlı maksimum moral">
        <span class="snum" id="fest-moral-maks">—</span>
        <span class="slbl">MAKSİMUM</span>
      </div>
      <div class="cstat" title="Mevcut altın">
        <span class="snum" id="fest-altin">—</span>
        <span class="slbl">ALTIN</span>
      </div>
      <div class="cstat" title="Mevcut ekmek">
        <span class="snum" id="fest-ekmek">—</span>
        <span class="slbl">EKMEK</span>
      </div>
    </div>

    <!-- v1.14.0.58: Aktif festival countdown -->
    <div id="aktif-fest-wrap"></div>

    <h2 style="color:#c8a96e;font-family:'Cinzel',serif;margin-bottom:16px;font-size:clamp(16px,4vw,22px)">
      Festival Düzenle
    </h2>
    <p style="color:#666;font-size:12px;margin-bottom:20px">
      Festival düzenleyerek şehir moralini artırın. Her festival altın + ekmek harcar, anlık moral ve süreli saatlik bonus sağlar.
    </p>

    <!-- Festival Kartları -->
    <div id="fest-cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px">
      <div style="color:#555;text-align:center;padding:40px">Yükleniyor...</div>
    </div>

    <!-- Palantis Takvim -->
    <div style="margin-top:24px;color:#444;font-size:11px;text-align:center" id="fest-takvim"></div>

  </div>
</div>
<div id="toast"></div>
<div id="building-modal-mount"></div>

<script src="js/constants.js"></script>
<script src="js/utils.js?v=13500"></script>
<script src="js/servers.js"></script>
<script src="js/auth.js"></script>
<script src="js/toast.js"></script>
<script src="js/theme.js"></script>
<script src="js/cache-fetch.js"></script>
<script src="js/game-data.js?v=13499"></script>
<script src="js/hud.js?v=13500"></script>
<script src="js/nufus-render.js"></script>
<script src="js/layout.js?v=13499"></script>
<script src="js/rehber.js"></script>
<script src="js/page-festival.js"></script>
<script src="js/sw-register.js?v=13467"></script>
</body>
</html>
